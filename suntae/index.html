<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#143c32">
<title>기초업무평가 수신 문제은행</title>
<style>
  :root{color-scheme:light;--ink:#17231f;--muted:#6b7974;--line:#dfe7e2;--green:#176b4b;--deep:#143c32;--paper:#fff;--bg:#f1f5f2;--gold:#e4a83c}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
  button,select{font:inherit}button{cursor:pointer}.shell{width:min(850px,100%);margin:auto;padding:28px 18px 64px}
  header{padding:8px 2px 22px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{margin:4px 0 3px;font-size:clamp(24px,5vw,34px);line-height:1.25;letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);font-size:14px}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #193d2b0a;padding:24px}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:750}.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .field.full{grid-column:1/-1}.type-buttons{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.type-button{min-height:44px;padding:8px 6px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);font-size:13px;font-weight:750}.type-button.selected{border-color:var(--green);background:var(--green);color:#fff}.type-button small{display:block;font-size:10px;font-weight:500;opacity:.8}
  .button{border:0;border-radius:11px;padding:13px 18px;font-weight:800}.primary{background:var(--deep);color:white}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.start{width:100%;margin-top:20px}
  .counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px}
  .topline{display:flex;align-items:center;gap:10px;margin-bottom:16px}.tag{border-radius:999px;background:#e8f2ed;color:var(--green);padding:4px 10px;font-size:12px;font-weight:800}.tag.type{background:#f3eee2;color:#76571e}.counter{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .progress{height:5px;overflow:hidden;margin-bottom:24px;border-radius:5px;background:#e8eeea}.progress span{display:block;height:100%;background:var(--green);transition:width .2s}
  .jump-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:-8px 0 8px;color:var(--muted);font-size:12px}.jump-legend{display:flex;gap:9px}.jump-legend span{display:inline-flex;align-items:center;gap:4px}.jump-dot{width:9px;height:9px;border:1px solid #cfd9d3;border-radius:3px;background:#fff}.jump-dot.done{border-color:#75a88a;background:#e6f3ea}.jump-dot.wrong{border-color:#d9877a;background:#fff0ed}.question-jump{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:6px;margin-bottom:22px}.jump-button{min-height:36px;padding:4px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);font-size:12px;font-weight:750;font-variant-numeric:tabular-nums}.jump-button:hover:not(:disabled){border-color:var(--green)}.jump-button.done{border-color:#75a88a;background:#e6f3ea;color:#176b4b}.jump-button.wrong{border-color:#d9877a;background:#fff0ed;color:#9a392e}.jump-button.current{outline:2px solid var(--deep);outline-offset:1px}.jump-button:disabled{cursor:not-allowed;opacity:.4}
  .question{white-space:pre-wrap;font-size:19px;font-weight:720;line-height:1.75;letter-spacing:-.02em;margin:0 0 22px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);line-height:1.55}.choice:hover:not(:disabled){border-color:#86ad98;background:#fbfdfb}.choice:disabled{cursor:default}.choice .num{flex:none;color:var(--green);font-weight:850}.choice.good{border-color:#6ba886;background:#edf7f0}.choice.bad{border-color:#db8b7f;background:#fff1ef}
  .oxchoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oxchoices .choice{align-items:center;justify-content:center;font-size:20px;font-weight:850}
  .subjective{display:grid;gap:12px}.subjective textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.answerbox{white-space:pre-wrap;border:1px solid #cddfd3;border-radius:12px;background:#f3faf5;padding:15px}.answer-label{font-size:12px;font-weight:850;color:var(--green);margin-bottom:5px}.reference{margin-top:8px;color:var(--muted);font-size:12px}
  .feedback{margin-top:16px;padding:14px 15px;border-radius:12px;background:#f4f7f5;border:1px solid var(--line)}.feedback strong{display:block;margin-bottom:4px}.feedback p{margin:5px 0 0;white-space:pre-wrap}.rating{display:flex;gap:9px;margin-top:12px}.rating button{flex:1}.nav{display:flex;gap:10px;margin-top:18px}.nav button{flex:1}.hidden{display:none!important}.end{text-align:center}.score{font-size:38px;font-weight:900;color:var(--green);line-height:1.25;margin:8px}.end p{color:var(--muted)}
  .nav .home-button{flex:0 0 auto}.comments{border-top:1px solid var(--line);margin-top:22px;padding-top:17px}.comments h3{font-size:15px;margin:0 0 10px}.comment-count{font-size:12px;color:var(--muted);font-weight:500}.comment{padding:10px 12px;background:#f6f8f6;border-radius:10px;margin:7px 0}.comment-meta{font-size:12px;color:var(--muted);margin-bottom:3px}.comment-text{white-space:pre-wrap;font-size:14px}.comment-empty,.comment-note{font-size:12px;color:var(--muted)}.comment-form{display:grid;gap:8px;margin-top:12px}.comment-form input,.comment-form textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:9px;font:inherit}.comment-form textarea{min-height:72px;resize:vertical}.comment-form button{justify-self:end}.wrong-list{margin-top:18px;text-align:left}.wrong-item{border-top:1px solid var(--line);padding:14px 0}.wrong-item h3{font-size:14px;margin:0 0 6px}.wrong-item p{white-space:pre-wrap;margin:4px 0;font-size:13px}.wrong-item .answer{color:var(--green);font-weight:700}
  @media(max-width:600px){.shell{padding:20px 13px 42px}.panel{padding:19px 16px}.setup-grid{grid-template-columns:1fr}.field.full{grid-column:auto}.type-buttons{gap:5px}.type-button{padding:7px 2px;font-size:11px}.question{font-size:17px}.topline{gap:6px}.tag{padding:4px 8px}.question-jump{gap:5px}.jump-button{min-height:34px}}
</style>
</head>
<body>
<main class="shell">
  <header><div class="eyebrow">BNK · 수신</div><h1>기초업무평가 문제은행</h1><p class="subtitle">회차와 문항 유형을 골라 한 문제씩 풀어보세요.</p></header>
  <section id="setup" class="panel">
    <div class="setup-grid"><div class="field"><label for="exam">퀴즈 회차</label><select id="exam"><option value="all">전체 회차 · 360문항</option></select></div><div class="field"><label for="order">문제 순서</label><select id="order"><option value="sequential">회차 순서</option><option value="shuffle">무작위 순서</option></select></div><div class="field full"><label>문항 유형</label><div id="type-buttons" class="type-buttons"><button class="type-button selected" data-type="all" aria-pressed="true">전체</button><button class="type-button" data-type="ox" aria-pressed="false">OX</button><button class="type-button" data-type="mc" aria-pressed="false">객관식</button><button class="type-button" data-type="fill" aria-pressed="false">단답형</button><button class="type-button" data-type="essay" aria-pressed="false">서술형</button></div></div></div>
    <div id="type-counts" class="counts"></div>
    <button id="start" class="button primary start">퀴즈 시작</button>
  </section>
  <section id="quiz" class="panel hidden" aria-live="polite">
    <div class="topline"><span id="exam-tag" class="tag"></span><span id="type-tag" class="tag type"></span><span id="counter" class="counter"></span></div>
    <div class="progress"><span id="progress-fill"></span></div>
    <div class="jump-head"><span>문제 번호로 이동</span><div class="jump-legend"><span><i class="jump-dot done"></i>푼 문제</span><span><i class="jump-dot wrong"></i>오답</span></div></div>
    <div id="question-jump" class="question-jump" aria-label="문제 번호로 이동"></div>
    <h2 id="question" class="question"></h2>
    <div id="interaction"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="nav"><button id="home-during" class="button secondary home-button">처음으로</button><button id="prev" class="button secondary">이전</button><button id="next" class="button primary">다음</button></div>
    <section class="comments"><h3>💬 댓글 <span id="comment-count" class="comment-count"></span></h3><div id="comment-list"></div><div class="comment-form"><input id="comment-name" maxlength="20" placeholder="닉네임 (선택)"><textarea id="comment-text" maxlength="1000" placeholder="이 문제의 풀이, 해석, 암기 팁을 남겨주세요"></textarea><button id="comment-send" class="button primary">댓글 저장</button><div id="comment-note" class="comment-note">댓글은 이 기기의 브라우저에만 저장되며 다른 기기와 공유되지 않습니다.</div></div></section>
  </section>
  <section id="end" class="panel end hidden"><div class="eyebrow">완료</div><div id="score" class="score"></div><p id="score-detail"></p><button id="wrong-toggle" class="button secondary">틀린 문제 보기</button> <button id="again" class="button primary">다시 풀기</button> <button id="home" class="button secondary">처음으로</button><div id="wrong-list" class="wrong-list hidden"></div></section>
</main>
<script>
const $=id=>document.getElementById(id);const COMMENT_STORE="suntae-local-comments-v1";let bank=[],pool=[],index=0,marks=new Map(),comments=readLocalComments(),selectedType="all";
const typeNames={ox:"OX",mc:"객관식",fill:"단답형",essay:"서술형"};
const key=q=>`${q.exam}-${q.n}`;
function setText(el,value){el.textContent=value??""}
function readLocalComments(){try{const saved=JSON.parse(localStorage.getItem(COMMENT_STORE)||"{}");return saved&&typeof saved==="object"&&!Array.isArray(saved)?saved:{}}catch{return{}}}
async function init(){
  const basePath=location.pathname.replace(/\/index\.html$/i,"").replace(/\/?$/, "/");
  const response=await fetch(`${basePath}questions.json`);if(!response.ok)throw new Error(`문제은행 파일을 불러오지 못했습니다. (${response.status})`);bank=await response.json();
  [...new Set(bank.map(q=>q.exam))].sort((a,b)=>a-b).forEach(exam=>{const option=document.createElement("option");option.value=exam;option.textContent=`제${exam}회 · 45문항`;$("exam").append(option)});
  $("start").addEventListener("click",start);$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("again").addEventListener("click",start);$("home").addEventListener("click",home);$("home-during").addEventListener("click",home);$("wrong-toggle").addEventListener("click",toggleWrong);$("comment-send").addEventListener("click",sendComment);$("exam").addEventListener("change",updateTypeCounts);
  document.querySelectorAll(".type-button").forEach(button=>button.addEventListener("click",()=>{selectedType=button.dataset.type;document.querySelectorAll(".type-button").forEach(item=>{const active=item===button;item.classList.toggle("selected",active);item.setAttribute("aria-pressed",String(active))});updateTypeCounts()}));updateTypeCounts();
  try{$("comment-name").value=localStorage.getItem("suntae-comment-name")||""}catch{}
}
function updateTypeCounts(){const exam=$("exam").value,scope=bank.filter(q=>exam==="all"||q.exam===Number(exam)),counts={all:scope.length,ox:0,mc:0,fill:0,essay:0};scope.forEach(q=>counts[q.type]++);document.querySelectorAll(".type-button").forEach(button=>{const type=button.dataset.type,label=type==="all"?"전체":typeNames[type];button.replaceChildren(document.createTextNode(label));const small=document.createElement("small");small.textContent=`${counts[type]}문항`;button.append(small)});setText($("type-counts"),"");const pill=document.createElement("span");pill.className="pill";pill.textContent=`선택 유형 ${counts[selectedType]}문항`;$("type-counts").append(pill)}
function start(){const selected=$("exam").value;pool=bank.filter(q=>(selected==="all"||q.exam===Number(selected))&&(selectedType==="all"||q.type===selectedType));if($("order").value==="shuffle")pool=pool.slice().sort(()=>Math.random()-.5);index=0;marks=new Map();$("setup").classList.add("hidden");$("end").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function move(delta){index+=delta;if(index<0)index=0;if(index>=pool.length){finish();return}render()}
function render(){const q=pool[index],saved=marks.get(key(q));setText($("exam-tag"),`제${q.exam}회`);setText($("type-tag"),typeNames[q.type]);setText($("counter"),`${index+1} / ${pool.length}`);$("progress-fill").style.width=`${(index+1)/pool.length*100}%`;renderQuestionJump(q);setText($("question"),q.q);$("interaction").replaceChildren();$("feedback").classList.add("hidden");$("prev").disabled=index===0;$("next").textContent=index===pool.length-1?"결과 보기":"다음 문제";renderComments(q);
  if(q.type==="ox")renderOptions(q,["O","X"],saved,true);else if(q.type==="mc")renderOptions(q,q.o,saved,false);else renderSubjective(q,saved);
  if(saved&&(q.type==="ox"||q.type==="mc"))showFeedback(q,saved.correct);
  if(saved&&saved.revealed&&(q.type==="fill"||q.type==="essay"))showAnswer(q,saved);
}
function renderQuestionJump(current){const grid=$("question-jump");grid.replaceChildren();for(let number=1;number<=45;number++){const target=pool.findIndex(q=>q.exam===current.exam&&q.n===number),button=document.createElement("button");button.type="button";button.className="jump-button";button.textContent=number;button.setAttribute("aria-label",`${current.exam}회 ${number}번 문제`);if(target<0){button.disabled=true;button.title="선택한 문제 유형에 포함되지 않는 문항"}else{const question=pool[target],saved=marks.get(key(question));button.classList.toggle("done",!!saved&&(question.type==="ox"||question.type==="mc"?saved.correct:saved.revealed&&saved.known===true));button.classList.toggle("wrong",!!saved&&(question.type==="ox"||question.type==="mc"?!saved.correct:saved.revealed&&saved.known===false));if(target===index){button.classList.add("current");button.setAttribute("aria-current","step")}button.addEventListener("click",()=>{index=target;render()})}grid.append(button)}}
function renderOptions(q,options,saved,isOx){const wrap=document.createElement("div");wrap.className=isOx?"oxchoices":"choices";options.forEach((text,i)=>{const button=document.createElement("button");button.className="choice";if(saved){button.disabled=true;if(i===q.a)button.classList.add("good");if(i===saved.choice&&!saved.correct)button.classList.add("bad")};if(!isOx){const label=document.createElement("span");label.className="num";label.textContent=`${"①②③④"[i]}`;button.append(label)}const body=document.createElement("span");body.textContent=text;button.append(body);button.addEventListener("click",()=>{const correct=i===q.a;marks.set(key(q),{choice:i,correct});render()});wrap.append(button)});$("interaction").append(wrap)}
function renderSubjective(q,saved){const wrap=document.createElement("div");wrap.className="subjective";const input=document.createElement("textarea");input.placeholder=q.type==="essay"?"답안을 적어보세요 (선택)":"정답을 적어보세요 (선택)";if(saved?.draft)input.value=saved.draft;input.addEventListener("input",()=>{const old=marks.get(key(q))||{};old.draft=input.value;marks.set(key(q),old)});wrap.append(input);const button=document.createElement("button");button.className="button primary";button.textContent=saved?.revealed?"정답 확인됨":"정답 보기";button.disabled=!!saved?.revealed;button.addEventListener("click",()=>{const old=marks.get(key(q))||{};old.revealed=true;marks.set(key(q),old);render()});wrap.append(button);$("interaction").append(wrap)}
function showAnswer(q,saved){const box=document.createElement("div");box.className="answerbox";const label=document.createElement("div");label.className="answer-label";label.textContent="모범답안";const answer=document.createElement("div");answer.textContent=q.a;box.append(label,answer);if(q.r){const ref=document.createElement("div");ref.className="reference";ref.textContent=`참고: ${q.r}`;box.append(ref)}$("interaction").append(box);const rating=document.createElement("div");rating.className="rating";[[true,"맞았어요"],[false,"다시 볼게요"]].forEach(([value,text])=>{const b=document.createElement("button");b.className=`button ${value?"primary":"secondary"}`;b.textContent=text;b.addEventListener("click",()=>{const old=marks.get(key(q))||{};old.known=value;marks.set(key(q),old);showFeedback(q,value)});rating.append(b)});$("interaction").append(rating);if(saved.known!==undefined)showFeedback(q,saved.known)}
function showFeedback(q,correct){const box=$("feedback");box.replaceChildren();box.classList.remove("hidden");const heading=document.createElement("strong");heading.textContent=correct?"정답입니다":"정답을 확인해 보세요";box.append(heading);if(q.type==="ox"||q.type==="mc"){const ans=document.createElement("p");ans.textContent=`정답: ${q.type==="ox"?q.a:`${"①②③④"[q.a]} ${q.o[q.a]}`}`;box.append(ans)}if(q.e){const explanation=document.createElement("p");explanation.textContent=q.e;box.append(explanation)}if(q.r){const ref=document.createElement("div");ref.className="reference";ref.textContent=`참고: ${q.r}`;box.append(ref)}}
function commentKey(q){let hash=5381;const source=`수신${q.exam}|${q.q}`;for(let i=0;i<source.length;i++)hash=(hash*33+source.charCodeAt(i))>>>0;return `q${hash.toString(36)}`}
function renderComments(q){const list=$("comment-list");list.replaceChildren();const rows=comments[commentKey(q)]||[];setText($("comment-count"),rows.length?`${rows.length}개`:"");if(!rows.length){const empty=document.createElement("div");empty.className="comment-empty";empty.textContent="아직 댓글이 없습니다. 풀이와 팁을 남겨보세요.";list.append(empty)}rows.forEach(row=>{const item=document.createElement("div");item.className="comment";const meta=document.createElement("div");meta.className="comment-meta";meta.textContent=`${row.name||"익명"} · ${row.time||""}`;const body=document.createElement("div");body.className="comment-text";body.textContent=row.text||"";item.append(meta,body);list.append(item)});setText($("comment-note"),"댓글은 이 기기의 브라우저에만 저장되며 다른 기기와 공유되지 않습니다.")}
function sendComment(){const text=$("comment-text").value.trim();if(!text){setText($("comment-note"),"댓글 내용을 입력해주세요.");return}const q=pool[index];if(!q)return;const name=$("comment-name").value.trim()||"익명",k=commentKey(q),rows=comments[k]||[];rows.push({name,text,time:new Date().toLocaleString("ko-KR")});comments[k]=rows;try{localStorage.setItem(COMMENT_STORE,JSON.stringify(comments))}catch{rows.pop();if(!rows.length)delete comments[k];setText($("comment-note"),"이 브라우저에 저장할 수 없습니다. 저장공간을 확인해주세요.");return}try{localStorage.setItem("suntae-comment-name",name)}catch{}$("comment-text").value="";renderComments(q)}
function toggleWrong(){const list=$("wrong-list");if(!list.classList.contains("hidden")){list.classList.add("hidden");$("wrong-toggle").textContent="틀린 문제 보기";return}list.replaceChildren();const wrong=pool.filter(q=>{const saved=marks.get(key(q));return q.type==="ox"||q.type==="mc"?!saved?.correct:saved?.known===false});if(!wrong.length){const empty=document.createElement("p");empty.textContent="틀린 문제가 없습니다.";list.append(empty)}wrong.forEach(q=>{const saved=marks.get(key(q)),item=document.createElement("article");item.className="wrong-item";const title=document.createElement("h3");title.textContent=`제${q.exam}회 ${q.n}번 · ${typeNames[q.type]}`;const question=document.createElement("p");question.textContent=q.q;const answer=document.createElement("p");answer.className="answer";answer.textContent=`정답: ${q.type==="ox"?q.a:q.type==="mc"?`${"①②③④"[q.a]} ${q.o[q.a]}`:q.a}`;item.append(title,question);if(q.type==="ox"||q.type==="mc"){const your=document.createElement("p");const selected=saved?.choice;your.textContent=`내 답: ${selected===undefined?"미응답":q.type==="ox"?(["O","X"][selected]):`${"①②③④"[selected]} ${q.o[selected]}`}`;item.append(your)}item.append(answer);if(q.e){const explanation=document.createElement("p");explanation.textContent=q.e;item.append(explanation)}list.append(item)});list.classList.remove("hidden");$("wrong-toggle").textContent=`틀린 문제 숨기기 (${wrong.length})`}
function finish(){const objective=pool.filter(q=>q.type==="ox"||q.type==="mc"),subj=pool.filter(q=>q.type==="fill"||q.type==="essay");const got=objective.filter(q=>marks.get(key(q))?.correct).length;const rated=subj.filter(q=>marks.get(key(q))?.known!==undefined),selfGot=rated.filter(q=>marks.get(key(q)).known).length;$("quiz").classList.add("hidden");$("end").classList.remove("hidden");$("wrong-list").classList.add("hidden");$("wrong-toggle").textContent="틀린 문제 보기";setText($("score"),objective.length?`${got} / ${objective.length}`:`${selfGot} / ${subj.length}`);setText($("score-detail"),objective.length?`객관식·OX 정답 · 단답형/서술형 자기평가 ${selfGot} / ${rated.length} (평가 ${subj.length}문항)`:`자기평가 ${selfGot} / ${subj.length}문항`)}
