<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#143c32">
<title>기초업무평가 수신 문제은행</title>
<style>
  :root{color-scheme:light;--ink:#17231f;--muted:#6b7974;--line:#dfe7e2;--green:#176b4b;--deep:#143c32;--paper:#fff;--bg:#f1f5f2;--gold:#e4a83c}
  *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
  button,select{font:inherit}button{cursor:pointer}.shell{width:min(850px,100%);margin:auto;padding:28px 18px 64px}
  header{padding:8px 2px 22px}.eyebrow{color:var(--green);font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}
  h1{margin:4px 0 3px;font-size:clamp(24px,5vw,34px);line-height:1.25;letter-spacing:-.04em}.subtitle{margin:0;color:var(--muted);font-size:14px}
  .panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;box-shadow:0 10px 30px #193d2b0a;padding:24px}
  .setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;margin-bottom:7px;font-size:13px;font-weight:750}.field select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
  .button{border:0;border-radius:11px;padding:13px 18px;font-weight:800}.primary{background:var(--deep);color:white}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.start{width:100%;margin-top:20px}
  .counts{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.pill{border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted);font-size:12px}
  .topline{display:flex;align-items:center;gap:10px;margin-bottom:16px}.tag{border-radius:999px;background:#e8f2ed;color:var(--green);padding:4px 10px;font-size:12px;font-weight:800}.tag.type{background:#f3eee2;color:#76571e}.counter{margin-left:auto;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
  .progress{height:5px;overflow:hidden;margin-bottom:24px;border-radius:5px;background:#e8eeea}.progress span{display:block;height:100%;background:var(--green);transition:width .2s}
  .question{white-space:pre-wrap;font-size:19px;font-weight:720;line-height:1.75;letter-spacing:-.02em;margin:0 0 22px}.choices{display:grid;gap:10px}.choice{display:flex;align-items:flex-start;gap:12px;text-align:left;width:100%;padding:14px 15px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);line-height:1.55}.choice:hover:not(:disabled){border-color:#86ad98;background:#fbfdfb}.choice:disabled{cursor:default}.choice .num{flex:none;color:var(--green);font-weight:850}.choice.good{border-color:#6ba886;background:#edf7f0}.choice.bad{border-color:#db8b7f;background:#fff1ef}
  .oxchoices{display:grid;grid-template-columns:1fr 1fr;gap:10px}.oxchoices .choice{align-items:center;justify-content:center;font-size:20px;font-weight:850}
  .subjective{display:grid;gap:12px}.subjective textarea{width:100%;min-height:110px;resize:vertical;padding:12px 14px;border:1px solid var(--line);border-radius:11px;font:inherit}.answerbox{white-space:pre-wrap;border:1px solid #cddfd3;border-radius:12px;background:#f3faf5;padding:15px}.answer-label{font-size:12px;font-weight:850;color:var(--green);margin-bottom:5px}.reference{margin-top:8px;color:var(--muted);font-size:12px}
  .feedback{margin-top:16px;padding:14px 15px;border-radius:12px;background:#f4f7f5;border:1px solid var(--line)}.feedback strong{display:block;margin-bottom:4px}.feedback p{margin:5px 0 0;white-space:pre-wrap}.rating{display:flex;gap:9px;margin-top:12px}.rating button{flex:1}.nav{display:flex;gap:10px;margin-top:18px}.nav button{flex:1}.hidden{display:none!important}.end{text-align:center}.score{font-size:38px;font-weight:900;color:var(--green);line-height:1.25;margin:8px}.end p{color:var(--muted)}
  @media(max-width:600px){.shell{padding:20px 13px 42px}.panel{padding:19px 16px}.setup-grid{grid-template-columns:1fr}.question{font-size:17px}.topline{gap:6px}.tag{padding:4px 8px}}
</style>
</head>
<body>
<main class="shell">
  <header><div class="eyebrow">BNK · 수신</div><h1>기초업무평가 문제은행</h1><p class="subtitle">107회부터 114회까지, 회차별 45문항을 한 문제씩 풀어보세요.</p></header>
  <section id="setup" class="panel">
    <div class="setup-grid"><div class="field"><label for="exam">퀴즈 회차</label><select id="exam"><option value="all">전체 회차 · 360문항</option></select></div><div class="field"><label for="order">문제 순서</label><select id="order"><option value="sequential">회차 순서</option><option value="shuffle">무작위 순서</option></select></div></div>
    <div class="counts"><span class="pill">OX 10문항</span><span class="pill">객관식 20문항</span><span class="pill">단답형 10문항</span><span class="pill">서술형 5문항</span></div>
    <button id="start" class="button primary start">퀴즈 시작</button>
  </section>
  <section id="quiz" class="panel hidden" aria-live="polite">
    <div class="topline"><span id="exam-tag" class="tag"></span><span id="type-tag" class="tag type"></span><span id="counter" class="counter"></span></div>
    <div class="progress"><span id="progress-fill"></span></div>
    <h2 id="question" class="question"></h2>
    <div id="interaction"></div>
    <div id="feedback" class="feedback hidden"></div>
    <div class="nav"><button id="prev" class="button secondary">이전</button><button id="next" class="button primary">다음</button></div>
  </section>
  <section id="end" class="panel end hidden"><div class="eyebrow">완료</div><div id="score" class="score"></div><p id="score-detail"></p><button id="again" class="button primary">다시 풀기</button> <button id="home" class="button secondary">회차 선택</button></section>
</main>
<script>
const $=id=>document.getElementById(id);let bank=[],pool=[],index=0,marks=new Map();
const typeNames={ox:"OX",mc:"객관식",fill:"단답형",essay:"서술형"};
const key=q=>`${q.exam}-${q.n}`;
function setText(el,value){el.textContent=value??""}
async function init(){
  const response=await fetch("./questions.json");if(!response.ok)throw new Error("문제은행 파일을 불러오지 못했습니다.");bank=await response.json();
  [...new Set(bank.map(q=>q.exam))].sort((a,b)=>a-b).forEach(exam=>{const option=document.createElement("option");option.value=exam;option.textContent=`제${exam}회 · 45문항`;$("exam").append(option)});
  $("start").addEventListener("click",start);$("prev").addEventListener("click",()=>move(-1));$("next").addEventListener("click",()=>move(1));$("again").addEventListener("click",start);$("home").addEventListener("click",home);
}
function start(){const selected=$("exam").value;pool=bank.filter(q=>selected==="all"||q.exam===Number(selected));if($("order").value==="shuffle")pool=pool.slice().sort(()=>Math.random()-.5);index=0;marks=new Map();$("setup").classList.add("hidden");$("end").classList.add("hidden");$("quiz").classList.remove("hidden");render()}
function move(delta){index+=delta;if(index<0)index=0;if(index>=pool.length){finish();return}render()}
function render(){const q=pool[index],saved=marks.get(key(q));setText($("exam-tag"),`제${q.exam}회`);setText($("type-tag"),typeNames[q.type]);setText($("counter"),`${index+1} / ${pool.length}`);$("progress-fill").style.width=`${(index+1)/pool.length*100}%`;setText($("question"),q.q);$("interaction").replaceChildren();$("feedback").classList.add("hidden");$("prev").disabled=index===0;$("next").textContent=index===pool.length-1?"결과 보기":"다음 문제";
  if(q.type==="ox")renderOptions(q,["O","X"],saved,true);else if(q.type==="mc")renderOptions(q,q.o,saved,false);else renderSubjective(q,saved);
  if(saved&&(q.type==="ox"||q.type==="mc"))showFeedback(q,saved.correct);
  if(saved&&saved.revealed&&(q.type==="fill"||q.type==="essay"))showAnswer(q,saved);
}
function renderOptions(q,options,saved,isOx){const wrap=document.createElement("div");wrap.className=isOx?"oxchoices":"choices";options.forEach((text,i)=>{const button=document.createElement("button");button.className="choice";if(saved){button.disabled=true;if(i===q.a)button.classList.add("good");if(i===saved.choice&&!saved.correct)button.classList.add("bad")};if(!isOx){const label=document.createElement("span");label.className="num";label.textContent=`${"①②③④"[i]}`;button.append(label)}const body=document.createElement("span");body.textContent=text;button.append(body);button.addEventListener("click",()=>{const correct=i===q.a;marks.set(key(q),{choice:i,correct});render()});wrap.append(button)});$("interaction").append(wrap)}
function renderSubjective(q,saved){const wrap=document.createElement("div");wrap.className="subjective";const input=document.createElement("textarea");input.placeholder=q.type==="essay"?"답안을 적어보세요 (선택)":"정답을 적어보세요 (선택)";if(saved?.draft)input.value=saved.draft;input.addEventListener("input",()=>{const old=marks.get(key(q))||{};old.draft=input.value;marks.set(key(q),old)});wrap.append(input);const button=document.createElement("button");button.className="button primary";button.textContent=saved?.revealed?"정답 확인됨":"정답 보기";button.disabled=!!saved?.revealed;button.addEventListener("click",()=>{const old=marks.get(key(q))||{};old.revealed=true;marks.set(key(q),old);render()});wrap.append(button);$("interaction").append(wrap)}
function showAnswer(q,saved){const box=document.createElement("div");box.className="answerbox";const label=document.createElement("div");label.className="answer-label";label.textContent="모범답안";const answer=document.createElement("div");answer.textContent=q.a;box.append(label,answer);if(q.r){const ref=document.createElement("div");ref.className="reference";ref.textContent=`참고: ${q.r}`;box.append(ref)}$("interaction").append(box);const rating=document.createElement("div");rating.className="rating";[[true,"맞았어요"],[false,"다시 볼게요"]].forEach(([value,text])=>{const b=document.createElement("button");b.className=`button ${value?"primary":"secondary"}`;b.textContent=text;b.addEventListener("click",()=>{const old=marks.get(key(q))||{};old.known=value;marks.set(key(q),old);showFeedback(q,value)});rating.append(b)});$("interaction").append(rating);if(saved.known!==undefined)showFeedback(q,saved.known)}
function showFeedback(q,correct){const box=$("feedback");box.replaceChildren();box.classList.remove("hidden");const heading=document.createElement("strong");heading.textContent=correct?"정답입니다":"정답을 확인해 보세요";box.append(heading);if(q.type==="ox"||q.type==="mc"){const ans=document.createElement("p");ans.textContent=`정답: ${q.type==="ox"?q.a:`${"①②③④"[q.a]} ${q.o[q.a]}`}`;box.append(ans)}if(q.e){const explanation=document.createElement("p");explanation.textContent=q.e;box.append(explanation)}if(q.r){const ref=document.createElement("div");ref.className="reference";ref.textContent=`참고: ${q.r}`;box.append(ref)}}
function finish(){const objective=pool.filter(q=>q.type==="ox"||q.type==="mc"),subj=pool.filter(q=>q.type==="fill"||q.type==="essay");const got=objective.filter(q=>marks.get(key(q))?.correct).length;const rated=subj.filter(q=>marks.get(key(q))?.known!==undefined),selfGot=rated.filter(q=>marks.get(key(q)).known).length;$("quiz").classList.add("hidden");$("end").classList.remove("hidden");setText($("score"),`${got} / ${objective.length}`);setText($("score-detail"),`객관식·OX 정답 · 단답형/서술형 자기평가 ${selfGot} / ${rated.length} (평가 ${subj.length}문항)`)}
function home(){$("end").classList.add("hidden");$("quiz").classList.add("hidden");$("setup").classList.remove("hidden")}
init().catch(error=>{setText($("setup"),error.message)});
</script>
</body>
</html>
