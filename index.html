<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>소매금융 문제은행</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Malgun Gothic", "Apple SD Gothic Neo", sans-serif; background: #f4f6f8; color: #222; line-height: 1.6; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }
  h1 { font-size: 22px; margin-bottom: 4px; }
  .sub { color: #667; font-size: 14px; margin-bottom: 24px; }
  .card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 1px 4px rgba(0,0,0,.08); margin-bottom: 16px; }
  .row { margin-bottom: 16px; }
  .row .lbl { font-weight: bold; font-size: 14px; margin-bottom: 6px; display: block; }
  .seg { display: flex; gap: 8px; flex-wrap: wrap; }
  .seg button { flex: 1; min-width: 90px; padding: 10px; border: 1px solid #ccd; background: #fff; border-radius: 8px; cursor: pointer; font-size: 14px; }
  .seg button.on { background: #1a56db; color: #fff; border-color: #1a56db; }
  .big { width: 100%; padding: 14px; font-size: 16px; font-weight: bold; background: #1a56db; color: #fff; border: none; border-radius: 8px; cursor: pointer; }
  .big:disabled { background: #aab; cursor: default; }
  .meta { display: flex; gap: 8px; align-items: center; margin-bottom: 12px; font-size: 13px; }
  .badge { padding: 2px 10px; border-radius: 999px; font-weight: bold; }
  .b-cat { background: #e6efff; color: #1a56db; }
  .b-src { background: #eee; color: #555; }
  .b-type { background: #fff3e0; color: #b45309; }
  .prog { margin-left: auto; color: #667; }
  .qtext { font-size: 16px; font-weight: 600; white-space: pre-line; margin-bottom: 18px; }
  .opts { display: flex; flex-direction: column; gap: 8px; }
  .opts.ox { flex-direction: row; }
  .opts button { text-align: left; padding: 12px 14px; border: 1px solid #ccd; background: #fff; border-radius: 8px; cursor: pointer; font-size: 15px; line-height: 1.5; }
  .opts.ox button { flex: 1; text-align: center; font-size: 24px; font-weight: bold; padding: 18px; }
  .opts button:hover:not(:disabled) { border-color: #1a56db; }
  .opts button:disabled { cursor: default; }
  .opts button.correct { background: #e7f7ec; border-color: #16a34a; }
  .opts button.wrong { background: #fdeaea; border-color: #dc2626; }
  .fillbox { display: flex; gap: 8px; }
  .fillbox input { flex: 1; padding: 12px; font-size: 15px; border: 1px solid #ccd; border-radius: 8px; }
  .fillbox button { padding: 12px 20px; background: #1a56db; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 15px; }
  .hint { font-size: 12px; color: #889; margin-top: 6px; }
  .result { margin-top: 18px; padding: 16px; border-radius: 8px; display: none; }
  .result.ok { display: block; background: #e7f7ec; border: 1px solid #16a34a; }
  .result.no { display: block; background: #fdeaea; border: 1px solid #dc2626; }
  .result .verdict { font-size: 17px; font-weight: bold; margin-bottom: 8px; }
  .result.ok .verdict { color: #15803d; }
  .result.no .verdict { color: #b91c1c; }
  .result .ans { font-weight: bold; margin-bottom: 8px; }
  .result .expl { font-size: 14px; white-space: pre-line; }
  .result .ref { font-size: 12px; color: #667; margin-top: 10px; }
  .nextbar { margin-top: 14px; display: none; }
  .score { text-align: center; padding: 10px 0 20px; }
  .score .pct { font-size: 44px; font-weight: bold; color: #1a56db; }
  .wrongitem { border-top: 1px solid #eee; padding: 12px 0; font-size: 14px; }
  .wrongitem .wq { font-weight: 600; white-space: pre-line; }
  .wrongitem .wa { color: #15803d; margin-top: 4px; }
  .twobtn { display: flex; gap: 10px; margin-top: 16px; }
  .twobtn button { flex: 1; }
  .ghost { width: 100%; padding: 14px; font-size: 15px; background: #fff; color: #1a56db; border: 1px solid #1a56db; border-radius: 8px; cursor: pointer; font-weight: bold; }
  .prevbtn { padding: 2px 10px; border: 1px solid #ccd; background: #fff; border-radius: 999px; cursor: pointer; font-size: 13px; color: #556; }
  .prevbtn:disabled { opacity: .4; cursor: default; }
  .report { margin-top: 20px; border-top: 1px dashed #dde; padding-top: 10px; }
  .rep-toggle { background: none; border: none; color: #98a; font-size: 13px; cursor: pointer; padding: 0; }
  #rep-box { margin-top: 8px; }
  #rep-box textarea { width: 100%; min-height: 70px; padding: 10px; font-size: 14px; border: 1px solid #ccd; border-radius: 8px; font-family: inherit; resize: vertical; }
  #rep-box .rep-row { display: flex; gap: 8px; align-items: center; margin-top: 6px; }
  #rep-send { padding: 8px 16px; background: #b45309; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #rep-msg { font-size: 13px; color: #15803d; }
  .dlbtn { width: 100%; padding: 12px; font-size: 14px; background: #fff; color: #b45309; border: 1px solid #b45309; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 10px; }
  #cmt-sec { margin-top: 18px; border-top: 1px solid #e5e8ee; padding-top: 14px; }
  .cmt-title { font-weight: bold; font-size: 15px; margin-bottom: 10px; }
  .cmt-title span { color: #667; font-weight: normal; font-size: 13px; }
  .cmt { padding: 10px 12px; background: #f7f8fa; border-radius: 8px; margin-bottom: 8px; }
  .cmt-head { font-size: 12px; color: #667; margin-bottom: 4px; }
  .cmt-body { font-size: 14px; white-space: pre-line; }
  .cmt-empty { font-size: 13px; color: #98a; margin-bottom: 8px; }
  #cmt-form { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
  #cmt-form input { padding: 8px 10px; font-size: 14px; border: 1px solid #ccd; border-radius: 8px; width: 160px; }
  #cmt-form textarea { padding: 10px; font-size: 14px; border: 1px solid #ccd; border-radius: 8px; min-height: 60px; font-family: inherit; resize: vertical; }
  #cmt-send { align-self: flex-end; padding: 8px 18px; background: #1a56db; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; }
  #cmt-send:disabled { background: #aab; }
</style>
</head>
<body>
<div class="wrap">
  <h1>소매금융 업무역량평가 문제은행</h1>
  <div class="sub">2026 기출 50문항 + 신규 100문항 (정리본 기반)</div>

  <div id="screen-start" class="card">
    <div class="row"><span class="lbl">과목</span>
      <div class="seg" id="f-cat">
        <button data-v="전체" class="on">전체</button><button data-v="여신">여신</button><button data-v="외환">외환</button>
      </div></div>
    <div class="row"><span class="lbl">출처</span>
      <div class="seg" id="f-src">
        <button data-v="전체" class="on">전체</button><button data-v="기출">기출</button><button data-v="신규">신규</button>
      </div></div>
    <div class="row"><span class="lbl">출제 순서</span>
      <div class="seg" id="f-ord">
        <button data-v="랜덤" class="on">랜덤</button><button data-v="순서대로">순서대로</button>
      </div></div>
    <button class="big" id="btn-start"></button>
    <button class="dlbtn" id="btn-dl-start" style="display:none"></button>
  </div>

  <div id="screen-quiz" class="card" style="display:none">
    <div class="meta">
      <button class="prevbtn" id="btn-prev">← 이전</button>
      <span class="badge b-cat" id="q-cat"></span>
      <span class="badge b-src" id="q-src"></span>
      <span class="badge b-type" id="q-type"></span>
      <span class="prog" id="q-prog"></span>
    </div>
    <div class="qtext" id="q-text"></div>
    <div class="opts" id="q-opts"></div>
    <div class="fillbox" id="q-fill" style="display:none">
      <input type="text" id="fill-input" placeholder="정답 입력">
      <button id="fill-submit">제출</button>
    </div>
    <div class="hint" id="q-hint" style="display:none"></div>
    <div class="result" id="q-result">
      <div class="verdict" id="r-verdict"></div>
      <div class="ans" id="r-ans"></div>
      <div class="expl" id="r-expl"></div>
      <div class="ref" id="r-ref"></div>
    </div>
    <div class="nextbar" id="nextbar"><button class="big" id="btn-next">다음 문제</button></div>
    <div id="cmt-sec" style="display:none">
      <div class="cmt-title">💬 댓글 <span id="cmt-count"></span></div>
      <div id="cmt-list"></div>
      <div id="cmt-form">
        <input type="text" id="cmt-name" placeholder="닉네임" maxlength="20">
        <textarea id="cmt-text" placeholder="이 문제에 대한 해석·풀이·암기팁을 남겨주세요" maxlength="1000"></textarea>
        <button id="cmt-send">댓글 등록</button>
      </div>
      <div class="hint" id="cmt-note" style="display:block"></div>
    </div>
    <div class="report">
      <button class="rep-toggle" id="rep-toggle">⚠ 문제 제보 (오타·오답·수정 요청)</button>
      <div id="rep-box" style="display:none">
        <textarea id="rep-text" placeholder="이상하거나 수정이 필요한 내용을 적어주세요"></textarea>
        <div class="rep-row">
          <button id="rep-send">제보 저장</button>
          <span id="rep-msg"></span>
        </div>
      </div>
    </div>
  </div>

  <div id="screen-end" class="card" style="display:none">
    <div class="score">
      <div class="pct" id="e-pct"></div>
      <div id="e-detail"></div>
    </div>
    <div id="e-wrong"></div>
    <div class="twobtn">
      <button class="ghost" id="btn-retry" style="display:none">틀린 문제 다시 풀기</button>
      <button class="big" id="btn-home">처음으로</button>
    </div>
    <button class="dlbtn" id="btn-dl-end" style="display:none"></button>
  </div>
</div>

<script>
// c:과목, s:출처, t:유형(ox/mc/fill), q:문제, o:보기, a:정답(ox:"O"/"X", mc:index, fill:[허용답]), e:해설, r:출처매뉴얼
const Q = [
// ===== 기출: 여신 30문항 =====
{c:"여신",s:"기출",t:"ox",q:"“대환”이라 함은 기존 여신의 여신과목과 다른 과목으로 재취급하는 경우를 말하며, 타행 대환은 제외한다.",a:"O",e:"대환은 기존 여신의 여신과목과 다른 과목으로 재취급하는 경우를 말한다. 동일 과목이라도 자금 성격이 다른 경우(예: 공무원대출→직장인 프리미엄 대출 전환)나 신규여신을 취급하여 유사한 위험이 있는 기존 여신을 회수하는 경우도 포함된다.",r:"여신일반업무지침"},
{c:"여신",s:"기출",t:"ox",q:"“평점심사대출”이란 여신의 규모, 별도상품, 여신조건 등에 의해 심사자의 판단을 필요로 하는 대출을 말한다.",a:"X",e:"심사자의 판단을 필요로 하는 대출은 '인적심사대출'이다. 평점심사대출은 신청인의 신청평점(ASS)·행동평점(BSS)·사전승인평점(PSS)에 따라 여신 가부를 판단하는 대출이다.",r:"개인CSS여신 공통 업무매뉴얼"},
{c:"여신",s:"기출",t:"ox",q:"「BNK 프리미엄 전세자금대출」취급 시 신규 전세계약은 임대차계약서상 잔금지급일과 주민등록 전입일 중 빠른 날로부터 3개월 이내 신청하여야 한다.",a:"O",e:"신규 임차자금대출은 잔금지급일과 주민등록 전입일 중 빠른 날 기준으로 신청하며, 갱신은 갱신 임대차기간 시작일로부터 3개월 이내 신청한다.",r:"BNK 프리미엄 전세자금대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"ox",q:"“주택보유수”라 함은 소유권 이전 등기된 「주택법」상 주택 및 주거용 오피스텔을 포함한다.",a:"X",e:"주택보유수는 주택법상 주택 및 분양권·입주권을 모두 포함하되 주거용 오피스텔은 제외한다(본건 담보물도 산정 시 제외).",r:"주택담보대출 운용기준"},
{c:"여신",s:"기출",t:"ox",q:"「ONE신용대출 직장인대출」의 자격요건은 현 직장에서 3개월 이상 재직 중인 급여소득자이다.",a:"X",e:"ONE신용대출 직장인대출의 자격요건은 현 직장에서 6개월 이상 재직 중인 급여소득자이다.",r:"ONE신용대출 직장인대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"ox",q:"금리인하요구권 신청으로 약정기간 중 재산출된 금리에서 금리를 감면하지 않고 여신금리 산출표 상의 대고객 적용금리로 금리 적용 시 영업점 전결로 가능하다.",a:"O",e:"재산출된 금리에서 추가 감면 없이 여신금리 산출표상 대고객 적용금리를 그대로 적용하는 경우에는 영업점 전결로 처리 가능하다.",r:"금리인하요구권 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"고객과 여신 상담 시 징구해야 할 서류로 옳지 않은 것은?",o:["융자상담신청서","대출거래약정서","신용정보제공동의서","적합성·적정성 확인서"],a:1,e:"여신상담 시 징구서류는 융자상담신청서, 상품설명서, 신용정보제공동의서, 적합성·적정성 확인서이다. 대출거래약정서는 상담 단계가 아니라 대출 약정(실행) 시 징구한다.",r:"여신일반업무지침"},
{c:"여신",s:"기출",t:"mc",q:"여신일반업무지침에서 정하는 “여신의 부적격자”로 옳지 않은 것은?",o:["신용관리대상자","특수채권보유자","당행 연체채권보유자","관리대상업종 영위자"],a:3,e:"여신의 부적격자는 신용관리대상자(당행 연체채권 보유자, 특수채권 보유자, 연체 등 정보 및 금융질서문란정보 보유자), 기타 신용관리대상자(공공기록·특수기록 정보 보유자), 여신금지업종 영위자이다. '관리대상업종 영위자'는 부적격자가 아니다.",r:"여신일반업무지침"},
{c:"여신",s:"기출",t:"mc",q:"여신 관련 부대비용에 대한 내용으로 옳지 않은 것은?",o:["저당권 설정비용은 당행이 부담한다.","저당권 말소비용은 고객이 부담한다.","인지세는 당행과 고객이 각 50%씩 부담한다.","감정평가 후 대출 미취급으로 인한 감정실비는 고객이 부담한다."],a:3,e:"감정평가 후 대출을 취급하지 않을 경우 감정실비는 당행이 부담한다. 인지세는 당행·고객 각 50%, 저당권 설정비용은 당행, 말소(감액 포함)비용은 고객 부담이 맞다.",r:"여신일반업무지침"},
{c:"여신",s:"기출",t:"mc",q:"대출계약 철회제도에 대한 내용으로 옳지 않은 것은?",o:["철회가능대상 대출금액에는 제한이 없다.","신청대상은 전문금융소비자가 아닌 일반금융소비자이다.","당행 대출의 경우 실행일로부터 14영업일 이내에 신청하여야 한다.","대출계약 철회로 인한 회수 시 중도상환수수료를 면제하여야 한다."],a:2,e:"대출계약 철회는 계약서류를 발급받은 날(대출실행일)로부터 14일 이내('영업일'이 아님) 신청 가능하다. 일반금융소비자 대상, 대출금액 제한 없음, 중도상환수수료 면제는 맞는 설명이다.",r:"대출계약 철회제도 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"DSR 산출을 제외할 수 있는 경우로 옳지 않은 것은?",o:["서민금융상품","주택담보대출","전세자금대출(신규임차자금대출)","대출금액 3백만원 이하 소액대출"],a:1,e:"DSR 산정 제외 대상: 서민금융상품, 3백만원 이하 소액대출, 전세자금대출, 중도금·이주비대출, 주택연금대출, 불가피한 채무인수 등. 주택담보대출은 DSR 산출 대상이다.",r:"DSR운용지침"},
{c:"여신",s:"기출",t:"mc",q:"주택담보대출 취급 시 세대원의 범위로 옳지 않은 것은?",o:["세대분리된 배우자","주민등록등본 상 형제·자매","주민등록등본 상 직계존속","주민등록등본 상 직계비속"],a:1,e:"세대는 주민등록등본상 배우자, 직계존속(배우자의 직계존속 포함), 직계비속 및 그 배우자이며 세대분리된 배우자도 포함한다. 형제·자매는 세대원 범위에 포함되지 않는다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"기출",t:"mc",q:"근린주택에 대한 내용으로 옳지 않은 것은?",o:["공부상 주택 및 근린생활시설로 되어 있다.","주택임대차보증금과 상가임대차보증금 모두 공제한다.","MCI 및 한국주택금융공사 구입자금보증 가입이 가능하다.","공부상 건물 전체 면적 중 주택부분이 1/2이상인 주택이다."],a:2,e:"근린주택은 MCI(모기지신용보험) 및 한국주택금융공사 구입자금보증 가입이 불가하다. 나머지는 맞는 설명이다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"기출",t:"mc",q:"아래 차주의 경우 적용해야 하는 DSR 비율로 옳은 것은?\n◈ 2022.07.01 이후 신규 누적 가계대출이 2억원인 차주",o:["40% 이내","60% 이내","70% 이내","100% 이내"],a:0,e:"차주 단위 DSR 적용 대상(누적 가계대출 총액 1억원 초과)인 경우 DSR 40% 초과 취급이 불가하다.",r:"DSR운용지침"},
{c:"여신",s:"기출",t:"mc",q:"개인CSS여신의 신용등급 종류와 그 적용범위로 옳은 것은?",o:["CB등급 : 신규, 증대 취급 시","BS등급 : 기한연기 시","AS등급 : 사전승인대상자 한도 부여 시","PS등급 : 갱신, 회전, 대환, 채무인수 시"],a:1,e:"ASS(신청평점): 신규·증대·갱신·대환·조건변경 시 / BSS(행동평점): 기한연기 심사 및 마케팅 / PSS(사전승인평점): 고객별 사전 대출한도 부여 마케팅. 따라서 BS등급-기한연기가 옳다.",r:"개인CSS여신 공통 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"아래 개인CSS 인적심사 대상 중 LTV 회피성 여신에 해당하여 영업점 전결로 취급이 불가한 경우를 모두 고르시오.\n㉠ 신용대출 취급 후 2개월 이내 주택담보대출을 신규 신청하는 경우\n㉡ 신용대출 취급 후 2개월 이내 기타부동산담보대출을 신규 신청하는 경우\n㉢ 예금담보대출 취급 후 2개월 이내 신용대출을 신규 신청하는 경우\n㉣ 주택을 담보 취득할 목적으로 소유권 이전일 전후 2개월 이내에 기업자금대출을 신규 신청하는 경우",o:["㉠,㉡","㉠,㉡,㉢","㉠,㉡,㉣","㉠,㉡,㉢,㉣"],a:2,e:"LTV 회피 목적 신용여신 제한(본부 심사요청 대상): ①신용대출 취급 후 2개월 이내 주택담보·기타부동산담보대출 신규 신청 ②주택담보·기타부동산담보대출 취급 후 2개월 이내 신용대출 신청 ③주택 담보취득 목적으로 소유권 이전일 전후 2개월 이내 기업자금대출 신규 신청. 예금담보대출 후 신용대출(㉢)은 해당되지 않는다.",r:"개인CSS여신 대출심사 및 대출실행 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「ONE신용대출 공무원대출」의 자격요건에 대한 내용으로 옳지 않은 것은?",o:["정무직, 계약직 및 무기계약직의 경우 취급이 불가능하다.","사립학교 교직원의 경우 사립학교법에 의해 설립된 학교만 인정된다.","정부 및 지방자치단체에 근무중인 공무원 및 사립학교 교직원을 대상으로 한다.","공개경쟁채용시험의 합격과 채용후보자 등록 안내만 받은 자는 취급이 불가하다."],a:0,e:"공무원대출은 정무직·계약직·무기계약직도 포함하여 취급 가능하다. 합격·채용후보자 등록 안내만 받은 자는 불가, 사립학교는 사립학교법에 의해 설립된 학교만 인정된다.",r:"ONE신용대출 공무원대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「BNK 357 금리안심 모기지론」에 대한 내용으로 옳지 않은 것은?",o:["일정기간 고정금리 적용 후 변동금리로 전환되는 금리혼합형 상품이다.","고정금리 적용기간 중에도 옵션 이행 여부에 따라 대출금리가 변동될 수 있다.","본인 또는 제3자 개인 명의 주택을 담보제공하는 개인 고객이 대출대상자이다.","주택법에서 정하는 주택을 담보로 취급 가능하며 주거용 오피스텔은 제외한다."],a:3,e:"BNK 357 금리안심 모기지론은 주택뿐 아니라 주거용 오피스텔도 담보로 취급 가능하다.",r:"BNK 357금리안심 모기지론 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「BNK 행복스케치 모기지론」에 대한 내용으로 옳지 않은 것은?",o:["주택 및 주거용 오피스텔을 담보로 하여 취급이 가능하다.","고객의 재정 설계에 따라 장·단기 대출기간 선택이 가능하다.","상환방법은 일시상환, 분할상환, 할부상환으로 가능하며 종합통장대출은 불가하다.","대출 잔여만기가 3년 이상 남은 경우 일정기간 동안 기준금리 최대 상승폭을 설정하는 금리상한 옵션 전환제도를 신청할 수 있다."],a:2,e:"행복스케치 모기지론은 일시상환(종합통장대출 포함)·분할상환·할부상환이 모두 가능하다. 종합통장대출 불가가 아니다.",r:"BNK 행복스케치 모기지론 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「BNK 프리미엄 전세자금대출」로 취급 가능한 주택의 종류로 옳지 않은 것은?",o:["아파트","단독주택","다세대주택","주거용 오피스텔"],a:1,e:"프리미엄 전세자금대출 대상 주택은 아파트, 주거용 오피스텔, 연립/다세대주택이며 단독주택은 취급 불가하다.",r:"BNK 프리미엄 전세자금대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「BNK 프리미엄 전세자금대출」의 임대차 계약 요건으로 옳지 않은 것은?",o:["전세권 설정이 되어 있지 않거나 전세권 해지 시 취급 가능하다.","반드시 부동산중개업소를 통하여 주택임대차계약을 체결하여야 한다.","신규 임차자금대출의 임대차 계약기간은 1년 이상 2년 이내여야 한다.","임차인이 주택임대차보호법상 대항력과 우선변제권을 확보하고 있거나 확보할 수 있어야 한다."],a:2,e:"임대차 계약기간 1년 이상 2년 이내 요건은 전세안심대출(HUG)의 요건이다. 프리미엄 전세자금대출은 대출실행일 기준 임대차 잔여기간이 1년 미만이면 취급 불가하며, 대출기간은 1년 이상 3년 이내이다.",r:"BNK 프리미엄 전세자금대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「BNK 전세안심대출」의 대출(보증)기간에 대한 내용으로 옳지 않은 것은?",o:["대출(보증)기간은 12개월 ~ 25개월 이내 취급이 원칙이다.","당초 약정기간을 포함하여 최대 10년 까지 기한연장 가능하다.","대출만기일이 비영업일인 경우 전영업일을 대출 및 보증기간 만료일로 한다.","임대인의 전세보증금 반환이 늦어지는 경우 반환보증을 제외한 전세안심대출 보증 6개월 1회 연기 가능하다."],a:1,e:"전세안심대출에 최장 10년 기한연장 규정은 없다. 대출(보증)기간은 12~25개월, 만기일이 비영업일이면 전영업일이 만료일, 임대인 반환 지연 시 보증기간 만료일 전 1개월 이내 보증조건 변경신청서 제출로 반환보증 제외 전세안심대출 보증 6개월 1회 연기 가능하다.",r:"BNK 전세안심대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「ONE신용대출 전문직가계대출」에 대한 내용으로 옳지 않은 것은?",o:["자격요건은 전문 자격증(면허증)소지자로 신청일 현재 재직중인 급여소득자이다.","현재 직장에서 퇴직할 경우 대출금을 상환하기로 하는 특약을 체결해야 한다.","대출가능 금액이 5백만원 미만인 경우에는 대출금액 0원으로 한도 부결된다.","초우량의 경우 BSMP(부산은행 메인프라임) 5등급 이내인 경우 취급이 가능하다."],a:3,e:"전문직가계대출의 초우량은 BSMP(부산은행 메인프라임) 4등급 이내인 경우 취급 가능하다(5등급이 아님). 한도 5백만원 미만은 부결기준에 해당한다.",r:"ONE신용대출 전문직가계대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"mc",q:"「구입자금보증」가입시 보증대상 부동산에 대한 요건으로 옳지 않은 것은?",o:["감정가격 9억원 이내의 물건의 경우 가입이 가능하다.","당행 주택담보대출 상품의 경우에는 출연대상만 취급 가능하다.","아파트, 연립, 다세대, 단독주택, 주거용 오피스텔의 경우 가입이 가능하다.","소유권에 권리침해가 없는 물건에 한하며 선순위 임대차 여부와는 무관하다."],a:3,e:"구입자금보증은 소유권에 권리침해가 없고 선순위 임대차가 없는 물건에 한하여 가입 가능하다. 선순위 임대차 여부와 무관하지 않다.",r:"구입자금보증 운용 업무매뉴얼"},
{c:"여신",s:"기출",t:"fill",q:"대출금 지급 시 차주의 본인계좌로 대출금을 입금하지 않는 경우 차주로부터 (                )(을)를 징구하여야 한다.",a:["대출금 상환 위임장","대출금상환위임장","상환위임장","대출금지급위임장"],e:"대출금은 채무자 예금계좌 대체입금이 원칙이며, 별도 위임장을 통해 지급 위임을 받아 제3자에게 지급하는 경우 대출금 상환 위임장을 징구한다.",r:"여신일반업무지침"},
{c:"여신",s:"기출",t:"fill",q:"가계 비주택담보대출 신규 취급 시 (                ) 내에 소재하는 부동산 물건을 담보로 취득하는 경우 LTV는 최대 40% 이내로 적용한다.",a:["토지거래허가구역"],e:"토지거래허가구역 내 부동산 담보 취득 시 LTV 최대 40% 이내(허가구역 지정 이전부터 보유 중인 농축어업인은 제외). 일반 비주택담보대출 LTV는 최대 70%.",r:"가계 비주택담보대출 운용기준"},
{c:"여신",s:"기출",t:"fill",q:"「BNK 행복스케치 전세자금대출」취급 시 (                )(을)를 제출하여 확정일자 번호 확인이 가능한 경우 주택보증 제규정 및 기준에 따른 확정일자부 임대차계약서를 제출한 것으로 인정한다.",a:["주택 임대차계약 신고필증","주택임대차계약신고필증","임대차계약신고필증","신고필증"],e:"'주택 임대차계약 신고필증'을 제출하여 확정일자 번호 확인이 가능하면 확정일자부 임대차계약서 제출로 인정한다.",r:"BNK 행복스케치 전세자금대출 업무매뉴얼"},
{c:"여신",s:"기출",t:"fill",q:"2018.09.14 이후 취급된 주택담보대출 타행 대환대출의 경우 기존 대출 취급 금융기관에 (                )(을)를 요청하여 특약 이행여부를 확인하여야 한다.",a:["대출현황확인서"],e:"타행 대환대출 시 기존 취급기관에 '대출현황확인서'를 요청하여 기존 특약 이행여부를 확인해야 하며, 미이행 시 대환 취급이 불가하다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"기출",t:"fill",q:"「ONE 신용대출 새희망홀씨Ⅱ」의 일시상환방식은 당초기간 포함 최장 (      )년간 기한연기 가능하며 만기일까지 10%이상 내입하여야 기한연기 가능하다.",a:["7","7년"],e:"새희망홀씨는 최장 7년간 기한연기 가능하며, 일시상환방식은 만기일까지 최초금액 기준 10% 이상 내입해야 기한연기가 가능하다.",r:"ONE신용대출 새희망홀씨Ⅱ 업무매뉴얼"},
{c:"여신",s:"기출",t:"fill",q:"‘소매개인기업’ 이라 함은 복식기장의무자로서 총자산 (  ㉠  )억원 이하, 매출액 (  ㉡  )억원 이하, 기업여신 5억원 이하의 개인사업자를 말한다.",a:["10,20","10억,20억"],h:"㉠, ㉡ 순서대로 쉼표로 구분하여 입력 (예: 5,15)",e:"소매개인기업: 복식기장의무자, 총자산 10억원 이하, 매출액 20억원 이하, 기업여신 5억원 이하 개인사업자. (참고: 소규모자영업자는 간편장부 기장업체, 기업여신 5억원 이하)",r:"개인CSS여신 공통 업무매뉴얼"},
// ===== 기출: 외환 20문항 =====
{c:"외환",s:"기출",t:"ox",q:"당ᆞ타발 송금수수료는 영업점장이 감면 또는 면제할 수 있다.",a:"O",e:"당·타발송금수수료는 영업점장 감면/면제 권한 항목이다(사회적 약자 면제 등). 외화현찰수수료는 고시요율의 1/2 이내, 대체료 면제도 영업점장 전결 가능.",r:"외국환수수료지침"},
{c:"외환",s:"기출",t:"ox",q:"외국인 거주자는 증빙서류가 없는 경우 미화2만불 상당액 이내에서 매도 가능하다.",a:"X",e:"외국인 거주자에 대한 매도는 증빙 없는 경우 미화 1만불 이내이다(2만불이 아님). 국민인 거주자의 소지목적 매도는 금액 제한이 없다.",r:"외국통화 매도 업무매뉴얼"},
{c:"외환",s:"기출",t:"ox",q:"꿈이룸 외화자유적금의 가입대상은 만18세이하 국민인 거주자로 1인 1계좌만 개설 가능하다.",a:"O",e:"꿈이룸 외화자유적금: 만18세 이하 국민인 거주자(실명의 개인), 1인 1계좌, 가입금액 최대 미화 1만불, 계약기간 1년, 가입통화 USD.",r:"외화예금 업무매뉴얼"},
{c:"외환",s:"기출",t:"ox",q:"타발송금 지급 시 계좌번호가 명기되어 송금된 경우 실명확인 생략 가능하다.",a:"O",e:"타발송금 지급 시 계좌번호가 명기되어 있는 경우와 1백만원 상당액 이하 송금은 실명확인 생략이 가능하다.",r:"타발송금 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"외환업무관련 수수료에 대한 내용으로 옳지 않은 것은?",o:["국내송금 시 미화 1만불 상당액 이하의 당발송금수수료는 5,000원이다.","타발송금지급 시 미화 1,000불 또는 그 상당액 미만의 경우 수수료는 면제한다.","외화수표 매입 시 우편료는 별도로 받는다.","다문화가족의 경우 당발송금수수료를 면제한다."],a:1,e:"타발송금 수수료는 미화 100불 미만인 경우 면제한다(1,000불 미만이 아님). 국내 당발송금 1만불 이하 5,000원, 외화수표 매입 시 우편료 별도, 다문화가정 당발송금수수료 면제는 맞다.",r:"외국환수수료지침"},
{c:"외환",s:"기출",t:"mc",q:"영업점 전행 감면 가능한 수수료로 옳은 것은?",o:["외화현찰수수료 면제","송금 사후관리 전문 전신료 면제","당발송금 전신료 면제","대체료 면제"],a:3,e:"대체료 면제는 영업점장 전결 감면 항목이다. 외화현찰수수료는 '면제'가 아닌 고시요율의 1/2 이내 감면만 가능하다.",r:"외국환수수료지침"},
{c:"외환",s:"기출",t:"mc",q:"추심전 매입한 외화수표 관련 수수료에 적용할 환율로 옳은 것은?",o:["전신환매도율","기준환율","재정환율","수입어음결제율"],a:0,e:"전신환매도율 적용 대상: 추심전 매입 외화수표·수출환어음·외화내국신용장어음의 부도대금 및 이자, 대외지급수수료, 외화대출·외화대지급금 원리금 등. 일반 수수료는 받는 시점의 기준환율이 원칙이다.",r:"외국환수수료지침"},
{c:"외환",s:"기출",t:"mc",q:"외국환신고(확인)필증 발급대상으로 옳은 것은?",o:["해외유학생경비 목적 미화 2만불을 휴대하여 반출하는 경우","비거주자인 재외동포재산반출 목적 미화 5천불을 휴대하여 반출하는 경우","법인명의의 일반해외여행경비 미화 2만불을 휴대하여 반출하는 경우","대외계정에서 미화 5천불을 대외지급수단으로 인출하는 경우"],a:0,e:"해외유학경비·해외체재비·재외동포 국내재산반출·해외이주비는 미화 1만불 초과 시 필증 발급 대상이다. 재외동포 5천불과 대외계정 5천불 인출은 1만불 이하라 대상이 아니고, 법인명의 일반해외여행경비는 발급 대상이 아니다.",r:"외국통화매도 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"외화수표업무 처리방법으로 옳은 것은?",o:["외화수표는 추심 후 지급만 가능하다.","은행수표는 예금주가 은행을 지급인으로 발행한 수표로 당좌예금에 해당한다.","지급지가 미국인 경우 개인수표는 3개월, 은행수표는 6개월, TREASURY CHECK는 1년이내에 제시해야한다.","외화수표의 배서는 영문 및 자국문자로만 할 수 있다."],a:2,e:"제시기간: 개인수표 3개월 / 은행수표 6개월 / US Treasury Check 1년 / 여행자수표 무기한. 외화수표는 추심전 매입도 가능하고, 예금주가 은행을 지급인으로 발행한 것은 '개인수표'이며, 배서는 영문으로 수취인 본인이 해야 한다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"해외즉시당발송금에 대한 내용으로 옳은 것은?",o:["거래대상 : 실명의 개인(외국인 제외)","송금한도 : 건당 및 당일 USD 7,000불 이하","취급통화 : USD, JPY","영업점 거래시간 : 09:00 ~ 17:00"],a:1,e:"해외즉시당발송금(웨스턴유니온): 송금한도 건당 및 당일 USD 7,000 이하. 거래대상은 외국인을 포함한 실명의 개인(법인·개인사업자 불가), 취급통화는 USD만 가능하다.",r:"해외즉시당발송금 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"외화보통예금에 대한 내용으로 옳지 않은 것은?",o:["정의 : 예치기간에 제한없이 수시로 예금과 인출이 자유로운 예금","예치금액 : 최저예수금액없음","예치기간 : 제한없음","적용이율 : 무이자"],a:3,e:"외화보통예금은 무이자가 아니라 자금부장이 별도 고시하는 이율을 적용한다. 무이자는 외화당좌예금·별단예금이다.",r:"외화예금 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"인터넷 ONE환전에 대한 내용으로 옳지 않은 것은?",o:["비로그인 환전 시 1일 원화1백만원 이하 환전 가능하다.","환전사유는 해외여행경비 및 외화보유 사유이다.","이용대상은 국민인거주자 및 외국인거주자이다.","인수예정일은 환전신청일로부터 30일 이내 지정 가능하다."],a:2,e:"ONE환전 이용대상에 외국인거주자는 포함되지 않는다. 비로그인 1일 원화 1백만원 이하, 환전사유는 해외여행경비·외화보유, 인수예정일 30일 이내 지정(예정일 포함 7영업일까지 유효)은 맞다.",r:"인터넷외환취급 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"다음 중 거주자가 아닌 것은?",o:["6개월이상 국내에 체재하고 있는 외국인","국내주둔 미합중국군대 등의 외국군인","대한민국내에 주된 사무소를 둔 법인","대한민국 재외공관에 근무할 목적으로 외국에 파견되어 체재하고 있는 자"],a:3,e:"문제은행 정답 기준 ④. ※ 참고: 외국환거래법령상 재외공관 근무 목적 파견 체재자는 '거주자', 국내주둔 미합중국군대 등의 외국군인은 '비거주자'로 규정되어 있어 ②도 검토 여지가 있는 문항이다. 실제 시험에서는 지문 구성을 반드시 확인할 것.",r:"거주자와 비거주자의 구분"},
{c:"외환",s:"기출",t:"mc",q:"해외유학생 거래에 대한 내용으로 옳지 않은 것은?",o:["여권사본 및 입학허가서등 입학을 증명할 수 있는 서류를 받아야 한다.","최초 송금 시 당발송금수수료는 전액 면제한다.","휴대출국인 경우 금액을 불문하고 외국환신고(확인)필증을 교부한다.","해외송금 및 휴대출국을 위한 외국통화 환전 모두 가능하다."],a:2,e:"해외유학생(해외체재자)의 휴대출국 시 미화 1만불 초과인 경우에 외국환신고(확인)필증을 발행·교부한다(금액 불문이 아님). 최초 송금 시 당발송금수수료 면제, 2회차부터 50% 감면.",r:"해외여행경비 등의 지급방법 및 유의사항"},
{c:"외환",s:"기출",t:"mc",q:"해외즉시당발송금 가능 항목으로 옳지 않은 것은?",o:["거주자의 지급증빙서류 미제출 지급","외국인거주자 또는 비거주자의 국내보수 지급(지정항목 08)","비거주자의 여행경비 범위내 재환전","해외이주비 지급(지정항목 75)"],a:3,e:"해외즉시당발송금 가능 항목: 무증빙 해외송금, 해외체재비, 국내보수 지급(지정항목 08), 비거주자의 여행경비 범위 내 재환전. 해외이주비는 불가하다.",r:"해외즉시당발송금 업무매뉴얼"},
{c:"외환",s:"기출",t:"mc",q:"거주자계정 외화예금 개설대상자로 옳지 않은 것은?",o:["외국인 거주자","외국인 개인사업자","국민인 거주자","국내소재 법인"],a:0,e:"거주자계정 개설대상은 국민인 거주자, 외국인 개인사업자, 국내소재 법인이다. 외국인 거주자와 비거주자는 대외계정 개설대상이다.",r:"예금 종류별, 계정별 예치, 처분 시 업무처리 방법"},
{c:"외환",s:"기출",t:"fill",q:"국민인거주자가 외국으로부터 송금된 미화 10만불 초과의 대외지급수단을 매입하는 경우 취득경위 입증서류를 제출하지 않을 시 (             )(을)를 징구한다.",a:["영수확인서"],e:"거주자가 영수금액(동일자·동일인·동일점포 합산) 미화 10만불 초과 시 입증서류를 제출하지 않으면 '영수확인서'를 징구한다. 수취인 불명으로 송금된 날로부터 3영업일 이내 사유를 알 수 없으면 영수확인서 생략 후 이전거래로 매입한다.",r:"타발송금 업무매뉴얼"},
{c:"외환",s:"기출",t:"fill",q:"원화대가를 수반하지 아니하는 USD 현찰매매시에는 (       )의 외화현찰수수료를 징수한다.",a:["1.75%","1.75"],e:"외화현찰수수료: USD 등 일반 통화는 1.75%, CNY·IDR·MYR·PHP·TWD·THB는 6.00%를 적용한다.",r:"외국환수수료지침"},
{c:"외환",s:"기출",t:"fill",q:"해외유학생 지급 시 연간 지급금액이 미화(         )(을)를 초과하는 경우에는 매월 별로 익월10일 이내에 국세청장에게 통보한다.",a:["10만불","미화 10만불","100,000불","10만달러","10만"],e:"해외유학생·체재자의 연간(1.1~12.31) 지급금액이 미화 10만불 초과 시 매월별로 익월 10일 이내 국세청장에게 통보한다.",r:"해외유학생, 이주자 취급지침"},
{c:"외환",s:"기출",t:"fill",q:"영업점장은 대고객 거래 시 외환시장 동향 및 타행대비 경쟁력 제고, 당행수익기여도 등을 종합적으로 감안하여 미달러화의 경우 매매공차의 (           )(을)를 초과하지 않는 범위에서 우대율을 가감하여 개별환율을 적용할 수 있다.",a:["70%","70"],e:"개별환율 우대율 한도는 매매공차의 70% 이내이다(PHP·TWD·MYR·IDR·VND 현찰은 50%, ONE환전 USD/JPY/EUR은 90%).",r:"환율 및 포지션집중업무지침"},
// ===== 신규: 여신 OX 12문항 =====
{c:"여신",s:"신규",t:"ox",q:"“갱신”은 신규에 준하여 재취급하는 것이므로 여신거래약정서를 징구하여야 한다.",a:"O",e:"갱신은 개별거래여신(당좌대출 및 한도거래여신 제외)에서 약정기간 또는 최장 연장기간을 넘어 기존과목과 동일과목으로 신규에 준하여 재취급하는 것이며, 신규에 준하므로 여신거래약정서를 징구한다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"ox",q:"한도거래여신은 일시상환방식만 가능하다.",a:"O",e:"상환방식은 분할상환·할부상환·일시상환으로 구분되며, 한도거래여신은 일시상환방식만 가능하다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"ox",q:"여신 취급기간이 1년을 초과할 경우 연 2회 이상 정기균등분할 상환조건으로 약정하며, 약정기간의 1/3 범위 내에서 최장 3년 6개월까지 거치기간을 인정한다.",a:"O",e:"분할상환 및 거치기간 약정 원칙이다. 가계자금대출, 예금/부금담보 일반자금대출 등은 적용 예외이며, 분할상환기간은 원칙적으로 연장할 수 없다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"ox",q:"동일인에 대하여 2개 이상의 영업점에서 여신을 취급하는 것이 원칙이다.",a:"X",e:"동일인에 대하여 2개 이상의 영업점에서 여신을 취급할 수 없는 것이 원칙이며, 타 영업점에서 추가 취급 시 기 여신을 수관한 후 취급함이 원칙이다(주택담보대출·비대면대출 등 예외 있음).",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"ox",q:"“고부담대출”이란 LTV 또는 DTI가 70%를 초과하는 대출을 말한다.",a:"X",e:"고부담대출은 LTV 또는 DTI가 60%를 초과하는 대출이다. 70% 초과 기준은 '고DSR 대출'(DSR 70% 초과)이다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"ox",q:"서민실수요자의 연소득 요건은 부부합산 9천만원 이하이다.",a:"O",e:"서민실수요자(LTV 70%): 부부합산 연소득 9천만원 이하 + 무주택 세대주 + 주택가격 요건(투기·투기과열지구 9억원 이하, 조정대상지역 8억원 이하). 대출한도 제한은 없다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"ox",q:"미성년자(기혼자 제외)는 신규 주택담보대출 취급이 원칙적으로 불가하다.",a:"O",e:"미성년자(기혼자 제외)는 신규 주담대 취급 불가가 원칙이다. 예외: 부모가 없는 미성년자에 대한 DTI 40% 이내 대출, 상속 등으로 불가피하게 채무를 인수하는 경우. 만기도래 시 1회에 한해 1년 이내 기한연기 가능(소년소녀가장 예외).",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"ox",q:"신규 변동금리 주택담보대출 취급 시 스트레스 DTI가 80%를 초과하는 대출은 고정금리로 취급하거나 80%를 초과하지 않도록 취급하여야 한다.",a:"O",e:"스트레스 DTI 운용 원칙이다. 예외: 기존 일시상환(거치식 분할상환 포함) 주담대의 비거치식 분할상환 전환, 중도금/이주비대출, 16년 이전 집단대출 사업장 입주자 잔금대출, 상속·채권보전 등 불가피한 채무인수.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"ox",q:"DSR 산정 시 전세자금대출은 제외되나 전세보증금담보대출은 산정대상에 포함된다.",a:"O",e:"전세자금대출·주택연금대출은 DSR 산정 제외 대상이지만, 전세보증금담보대출은 제외되지 않고 산정대상에 포함된다(연간 원금: 대출총액 ÷ 4년).",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"ox",q:"소득 산정 시 인정소득은 90%, 신고소득은 95%로 산정한다.",a:"X",e:"인정소득은 95%, 신고소득은 90%로 산정하며 최대 인정금액은 50백만원이다(단, 직장가입자의 인정소득은 50백만원 초과하여 100% 인정 가능).",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"ox",q:"대출계약 철회 시 당행이 기지급한 여신 부대비용은 당행이 부담한다.",a:"X",e:"대출계약 철회로 회수하는 경우 당행이 기지급한 부대비용(인지세, 설정수수료, 대출관련지급수수료, 감정평가수수료, 임대차조사수수료, 권리보험료)은 채무자로부터 회수한다.",r:"대출계약 철회제도 업무매뉴얼"},
{c:"여신",s:"신규",t:"ox",q:"새희망홀씨의 대출한도는 최대 35백만원이다.",a:"O",e:"새희망홀씨: 연소득 40백만원 이하 또는 50백만원 이하 & NICE 749/KCB 700 이하 대상, 대출한도 최대 35백만원, 최장 7년(65세 이상은 3년).",r:"ONE신용대출 새희망홀씨Ⅱ 업무매뉴얼"},
// ===== 신규: 여신 객관식 36문항 =====
{c:"여신",s:"신규",t:"mc",q:"여신일반업무지침상 용어의 정의로 옳지 않은 것은?",o:["기한연기: 최장 연장기간 범위 내에서 당초 취급 조건 그대로 여신 기한을 연장하는 것","갱신: 개별거래여신에 있어서 기존과목과 동일과목으로 신규에 준하여 재취급하는 것","회전: 당좌대출 및 한도거래제여신에 있어서 당초 약정금액을 초과하여 재취급하는 것","건별거래: 당좌대출, 종통대 및 한도거래제여신에서 한도약정금액 내 건별로 실행하는 여신"],a:2,e:"회전은 당초 약정금액 '범위 내'에서 동일과목으로 신규에 준하여 재취급하는 것이다. 약정금액 초과가 아니다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"불공정영업행위 금지에 대한 내용으로 옳지 않은 것은?",o:["차주의 의사에 반하여 다른 금융상품 계약을 강요하는 행위는 금지된다.","대출계약 성립 5년 이내에 중도상환수수료를 부과하는 행위는 금지된다.","개인에 대한 여신거래와 관련하여 제3자의 연대보증을 요구하는 행위는 금지된다.","동일인에 대하여 다른 명의로 분할여신을 취급하는 행위는 금지된다."],a:1,e:"중도상환수수료 부과 금지 기간은 대출계약 성립 3년 이내이다(다른 법령 및 대통령령에서 허용하는 경우 제외).",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"여신의 부적격자에 대한 예외 취급 사유로 옳지 않은 것은?",o:["연체채권의 회수 또는 정리를 위한 경우(원금초과 취급 불가)","기존 여신의 기한연기·갱신·대환에 한해 직무전결권자가 불가피하다고 인정하는 경우","신용보증서 담보여신, 당행 수신 담보 대출을 취급하는 경우","특수채권 보유자로서 총 채권잔액이 0원이고 최종 회수일자로부터 3년이 경과하여 정상등급이 부여된 경우"],a:3,e:"특수채권 보유자 예외는 총 채권잔액 0원 + 최종 회수일자로부터 5년 경과 + 정상등급 부여인 경우이다(3년이 아님).",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"차주별·자금용도별·상환방식별 구분으로 옳지 않은 것은?",o:["가계자금대출에는 사업자로 등록되지 아니한 개인의 부업자금이 포함된다.","운전자금대출은 설비취득, 신설, 확장 등 자본적 지출에 소요되는 자금이다.","할부상환은 원리금을 균등하게 분할 상환하는 방식이다.","일시상환은 원금을 만기에 일시 상환하는 방식이다."],a:1,e:"운전자금대출은 생산 및 판매활동에 소요되는 자금(수익적 지출)이며, 설비취득 등 자본적 지출에 소요되는 자금은 시설자금대출이다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"채무자 사망 시 재산상속인과의 거래 절차로 옳지 않은 것은?",o:["가족관계등록부 또는 공정증서 등을 받아 재산상속인을 확인한다.","재산상속인의 거래 계속 신청 시 신규거래 절차에 의하여 취급하고 담보권을 확보한다.","기명주권은 즉시 상속인 명의로 개서한다.","차순위 저당권자가 없으면 상속등기 없이 기존 저당권을 그대로 유용한다."],a:3,e:"차순위 저당권자가 없으면 상속등기를 필하고 신규 저당권 설정계약을 체결한다. 차순위 저당권자가 있으면 순위를 양도·포기하게 한 후 저당권설정 등기를 갱신한다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"상환 연장 관련 서류를 받지 않고 차주의 의사확인을 통해 기한연장할 수 있는 요건으로 옳지 않은 것은?",o:["해당 대출에 연대보증인 또는 제3자 담보제공자가 없을 것","대출조건 중 만기일만 변경될 것","금리가 함께 변경되는 경우에도 가능할 것","신용보증서 담보대출이 아닐 것"],a:2,e:"만기일만 변경되어야 하며 금리가 변경되면 서류징구 생략이 불가하다. 세 요건(무보증·무담보제공, 만기일만 변경, 신용보증서 담보대출 아님)을 모두 충족해야 한다.",r:"여신일반업무지침"},
{c:"여신",s:"신규",t:"mc",q:"주택담보대출 소득 구분에 대한 설명으로 옳은 것은?",o:["증빙소득: 매출액, 신용카드 사용액 등 신청자가 제출한 자료로 추정한 소득","인정소득: 국민연금, 건강보험료 납부액 등을 바탕으로 추정한 소득","신고소득: 공공성이 강한 기관에서 발급하고 객관성 있는 자료로 입증된 소득","인정소득은 다른 종류의 소득과 합산할 수 있다."],a:1,e:"증빙소득은 공공성 강한 기관 발급의 객관성 있는 자료로 입증된 소득(근로·연금·사업소득), 신고소득은 신청자 제출 자료로 추정한 소득이다. 인정소득은 타 소득과 합산 불가하다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"주택의 범위 및 관리기준으로 옳지 않은 것은?",o:["단독주택: 660제곱미터 이하, 19가구 이하, 3층 이하","아파트: 5층 이상","연립주택: 660제곱미터 초과, 4층 이하","도시형생활주택은 약식감정(공동주택가격 자문확인서)이 가능하다."],a:3,e:"도시형생활주택(30~300세대)은 약식감정(공동주택가격 자문확인서)이 불가하다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"주택구입목적 대출에 해당하지 않는 것은?",o:["소유권보존(이전) 등기일로부터 3개월 이내 취급되는 본인 및 배우자 명의의 주택담보대출","신규 주택 구입을 목적으로 기존 보유 주택을 담보로 받은 대출","분양주택에 대한 중도금대출 및 잔금대출","등기일로부터 3개월 이내 취급이나 명백히 생활안정자금임을 증빙한 대출"],a:3,e:"3개월 이내 취급이더라도 명백히 생활안정자금인 것을 증빙하는 경우 '구입목적 외 생활안정자금' 대출로 본다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"주택보유수 산정 시 제외되는 경우가 아닌 것은?",o:["대출신청일 이후 상속받은 주택","기존 보유 주택의 매매계약을 체결하고 계약금 수령 사실을 증명한 주택","2018.9.13까지 구입하여 임대주택으로 등록한 주택","구입목적 외 생활안정자금 대출에서의 신축 중인 주택과 분양권"],a:3,e:"구입목적 외 생활안정자금 대출은 본건 담보물과 신축 중인 주택, 분양권, 입주권, 구입예정 주택까지 모두 합산한다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"주택담보대출 담보물 평가방법으로 옳지 않은 것은?",o:["KB부동산 시세 고시 아파트는 고시된 '일반평균가' 이내로 평가한다.","중도금대출은 분양가액(조합원의 경우 추가분담액)을 적용한다.","잔금대출은 집단잔금대출용 분양가 시세정보 적용이 원칙이다.","이주비대출은 일반분양가에 추가분담금을 합산한 금액으로 평가한다."],a:3,e:"이주비대출은 전문감정기관 감정평가액 또는 일반분양가에서 추가분담금을 '공제'한 금액으로 평가한다(합산이 아님).",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"신용평가등급별 한도 적용으로 옳지 않은 것은?",o:["NICE 675점 이상 및 외국인: 기본한도의 100% 이내","NICE 674~600점: 기본한도의 90% 이내","NICE 349점 이하 또는 AS 10등급: 대출 취급 불가","동일금액 내 재취급(대환·회전·갱신)이라도 등급제한 예외 적용은 불가하다."],a:3,e:"동일금액 내 재취급(대환·회전·갱신) 또는 심사부서(주심사역) 승인을 받은 경우 등급제한 예외로 100% 적용이 가능하다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"주택구입목적 LTV 기준으로 옳지 않은 것은?",o:["생애최초 주택구매자 기타지역: 80%","투기·투기과열지구 및 조정대상지역 무주택세대: 40%","규제지역 내 서민실수요자: 60%","기타지역 2주택 이상 보유세대: 0%"],a:3,e:"기타지역 2주택 이상 보유세대는 LTV 60%이다. LTV 0%는 규제지역·수도권의 1주택(원칙)/2주택 이상 보유세대에 적용된다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"'25.6.27 이후 무주택자(처분조건 포함)의 수도권·규제지역 소재 주택담보대출 최대한도로 옳은 것은?",o:["주택가격 15억원 이하: 6억원","주택가격 15억원 초과~25억원 이하: 5억원","주택가격 25억원 초과: 3억원","주택가격과 관계없이 10억원"],a:0,e:"15억원 이하 6억원 / 15억원 초과~25억원 이하 4억원 / 25억원 초과 2억원으로 대출한도가 제한된다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"구입목적 외 생활안정자금 대출에 대한 내용으로 옳지 않은 것은?",o:["투기·투기과열지구 1주택 보유세대의 LTV는 40%이다.","규제지역 및 수도권의 2주택 이상 보유세대도 생활안정자금 대출이 가능하다.","취급 시 다른 신규 주택을 추가로 구입하지 않는다는 특약을 체결한다.","대출 세대의 주택보유수를 6개월 단위로 점검한다."],a:1,e:"규제지역 및 수도권 2주택 이상 보유세대는 구입목적 외 생활안정자금 대출이 불가하다(단, 임차보증금 반환목적은 추가약정서 징구 후 가능).",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"서민실수요자와 생애최초주택구매자 요건 비교로 옳지 않은 것은?",o:["서민실수요자: 부부합산 연소득 9천만원 이하","생애최초주택구매자: 연소득 제한 없음","생애최초주택구매자: 대출한도 최대 6억원","서민실수요자: 대출한도 최대 4억원"],a:3,e:"서민실수요자는 대출한도 제한이 없다. 대출한도 최대 6억원 제한은 생애최초주택구매자에 적용된다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"DTI 적용 배제 대상으로 옳지 않은 것은?",o:["단일물건 기준 전 금융기관 합산 주담대 1억원 이하","분양주택 중도금대출, 재건축·재개발 이주비대출","규제지역 내 사업장에 대한 입주자 잔금대출","상속, 채권보전을 위한 경매 참가 등 불가피한 대출채무 인수"],a:2,e:"입주자 잔금대출은 '규제지역 외' 사업장에 대한 경우에 DTI 적용이 배제된다. 규제지역 내 사업장은 배제 대상이 아니다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"소득 확인 세부방법으로 옳지 않은 것은?",o:["최근 2개년 증빙소득 확인 후 최근 1개년 소득으로 산정한다.","2개년 소득 차이가 20% 초과 시 2개년 평균 소득으로 산정한다.","1년 미만 증빙소득은 연환산 후 20%를 차감한다.","청년층, 신혼부부는 연환산 시 차감하지 않는다."],a:2,e:"1년 미만 증빙소득은 연환산 후 10%를 차감한다(청년층·신혼부부·불가피 사유는 차감 없음). 증가한 소득이 상시소득임을 입증하면 1개년 소득 인정.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"비거치식(거치기간 1년 이내 포함) 분할상환 대상이 아닌 것은?",o:["주택구입자금용 대출","고부담대출(단, LTV 60% 초과라도 DTI 30% 이하인 경우 제외)","신고소득으로 소득을 산정한 경우","분양주택 중도금대출"],a:3,e:"중도금대출, 입주자잔금대출, 상속·경매참가 등 불가피한 채무인수, 자금수요 목적이 단기이거나 명확한 상환계획을 전결권자가 인정하는 경우는 비거치식 분할상환 예외대상이다. 주담대 담보물건이 전 금융기관 합산 3건 이상인 경우도 대상에 포함된다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"스트레스 DTI 산출 시 당행 고정금리 인정상품으로 옳지 않은 것은?",o:["BNK 357 금리안심 모기지론 고정금리 3년 적용","ONE주택담보대출 고정금리 7년 적용","금리상한 모기지론 금리상한 적용기간 5년 이상","행복스케치 모기지론 리프라이싱 주기 60개월"],a:0,e:"BNK 357·ONE주택담보대출은 고정금리 기간 5년, 7년 이상 적용 시 고정금리로 인정되며 3년 고정은 불인정이다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"가계 비주택담보대출에 대한 내용으로 옳지 않은 것은?",o:["신규 비주택담보대출의 LTV는 최대 70%를 적용한다.","토지거래허가구역은 최대 40% 이내를 적용한다(지정 이전부터 보유 중인 농축어업인 제외).","우선변제대상 상가 소액보증금 합계액은 비주택 부동산가액의 최대 50%를 한도로 한다.","상업용 건물 담보 취급 시 소액보증금은 항상 심사시점 기준으로 산정한다."],a:3,e:"상업용 건물 담보 가계대출은 담보물권 취득시점의 소액보증금을 적용한다(채무변제 완료 시에만 심사시점 기준 산정).",r:"가계 비주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"mc",q:"DSR 연간 원금 산정방식으로 옳은 것은?",o:["신용대출: 대출총액 ÷ 10년","중도금 및 이주비대출: 대출총액 ÷ 25년","전세자금대출: 대출총액 ÷ 4년","장기카드대출(카드론): 대출총액 ÷ 5년"],a:1,e:"중도금·이주비대출은 상환방식 무관 대출총액 ÷ 25년. 신용대출은 ÷ 5년(10년 이내 분할상환 시 Max[실제만기, 5년]), 전세자금·예적금담보·보험계약대출은 원금 미반영(이자만), 카드론은 대출총액 ÷ 약정만기(최대 3년)이다.",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"mc",q:"DSR 연간 원금 산정방식으로 옳지 않은 것은?",o:["주담대 원금 일시상환: 대출총액 ÷ 대출기간(최대 10년)","전세보증금담보대출: 대출총액 ÷ 4년","오피스텔 외 비주택담보대출: 대출총액 ÷ 8년","예적금담보대출: 대출총액 ÷ 5년"],a:3,e:"예적금담보대출·전세자금대출·보험계약대출은 원금을 반영하지 않고 이자만 반영한다.",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"mc",q:"DSR 비율별 승인 전결권으로 옳은 것은?",o:["신용대출 DSR 90%: 여신위원회 승인","주담대 DSR 120%: 본부승인","비주택담보대출 DSR 160%: 본부승인","주담대 DSR 60%: 본부승인"],a:1,e:"주담대/집단잔금대출: 70~150% 본부승인, 150% 초과 여신위원회. 신용대출: 70~100% 본부승인, 100% 초과 여신위원회. 비주택담보: 70~150% & 담보유효가 이내 본부승인, 150% 초과 또는 담보유효가 초과 여신위원회. 70% 이하는 해당 여신전결권자.",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"mc",q:"스트레스 DSR 운용기준으로 옳지 않은 것은?",o:["스트레스 금리는 매년 6월, 12월 연 2회 제공된다.","스트레스 금리는 최소 1.5%p에서 최대 3.0%p이다.","신용대출은 전 금융기관 잔액 5천만원 초과 시 스트레스 금리를 적용한다.","변동형 주담대(금리 변동주기 도래)는 스트레스 금리의 100%를 적용한다."],a:2,e:"신용대출은 전 금융기관 잔액 1억원 초과 시 스트레스 금리를 적용한다. 만기 3년 미만 100%, 3~5년 60%, 5년 초과 미적용.",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"mc",q:"개인CSS 대상자 구분으로 옳은 것은?",o:["소규모자영업자: 복식기장의무자로서 총 기업여신 5억원 이하","소매개인기업: 간편장부 기장업체","소규모자영업자: 간편장부 기장업체로서 총 기업여신 5억원 이하 개인사업자","소매개인기업: 총자산 20억원 이하, 매출액 10억원 이하"],a:2,e:"소규모자영업자는 간편장부 기장업체(기업여신 5억원 이하), 소매개인기업은 복식기장의무자로 총자산 10억원 이하·매출액 20억원 이하·기업여신 5억원 이하이다. 총 익스포져 5억원 초과 시 개인CSS 적용 불가.",r:"개인CSS여신 공통 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"신청서등록(ASS 등록) 예외 대상이 아닌 것은?",o:["예·적금, 수익권 담보대출","약식품의 대출(정부보증학자금 등)","일괄대출/집단대출(중도금·이주비)","외국인등록번호를 보유한 외국인 대출"],a:3,e:"외국인 대출은 ASS 등록 예외이나, 외국인등록번호 보유 시에는 등록 대상이다.",r:"개인CSS여신 융자상담 및 품의신청 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"타행 담보금액 인정기준으로 옳은 것은? (가계대출, 1·2금융권 기준)",o:["타행 부동산담보(토지, 상가 등): 50% 인정","타행 부동산담보(토지, 상가 등): 120% 인정","타행 신용보증서: 100% 인정","타행 기타담보: 50% 인정"],a:0,e:"가계대출(1·2금융권)의 타행 부동산담보는 50%, 기타담보는 100% 인정한다. 120%는 기업대출(1금융권)의 타행 부동산담보 기준이며, 신용보증서는 타행 0% 인정이다.",r:"개인CSS여신 융자상담 및 품의신청 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"개인CSS 기한연기 대상여신 중 인적심사 대출에 해당하지 않는 것은?",o:["전액담보대출, 예적금/수익권 담보대출","임직원 및 외국인 대출","동일인 한도대상 신용여신 100백만원 초과","일반 개인 신용대출 30백만원"],a:3,e:"인적심사 대출: 전액담보·예적금/수익권 담보대출, 임직원·외국인 대출, 동일인 한도대상 신용여신 100백만원 초과/총여신 150백만원 초과, 약식품의 대상여신, 신용카드 대환대출 등. 이를 제외한 모든 대출은 평점심사 대출이다.",r:"개인CSS 기한연기 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"여신 기한연장 가능 기간으로 옳지 않은 것은?",o:["주택담보대출: 20년","시설자금대출: 15년","일반대출: 10년","새희망홀씨: 5년"],a:3,e:"기한연장 가능 기간: 주담대 20년, 시설대 15년, 일반대출 10년, 새희망홀씨 7년이다.",r:"여신 기한연기 관련 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"간편기한연기(간편실행)에 대한 내용으로 옳지 않은 것은?",o:["기일관리 리포트상 자동승인 대상계좌로서 기한연기 실행일로부터 20일 이내 만기도래 건이 대상이다.","대출만기 15일 경과 시에도 간편품의로 기한연기가 가능하다.","새희망홀씨 일시상환 계좌는 최초금액 기준 10% 내입여부를 확인한다.","영업점대출책임자는 이해관계인의 동의여부를 확인한다."],a:1,e:"대출만기 15일 경과 시 간편품의가 불가하며 일반품의를 통해 기한연기가 가능하다.",r:"개인CSS 기한연기 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"「BNK 357 금리안심 모기지론」의 만기일지정상환 비율로 옳은 것은?",o:["대출만기 10년 이내: 대출금액의 75% 이내","대출만기 15년 이내: 대출금액의 40% 이내","대출만기 30년 이내: 대출금액의 30% 이내","대출만기 40년 이내: 대출금액의 20% 이내"],a:1,e:"357: 10년 이내 50%, 15년 이내 40%, 20년 이내 30%, 30년 이내 20%, 35/40년은 지정 불가. (75%는 행복스케치 모기지론의 10년 이내 비율이다)",r:"BNK 357금리안심 모기지론 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"「BNK 행복스케치 모기지론」 금리상한 옵션 전환제도로 옳지 않은 것은?",o:["대출 잔여만기 3년 이상 남은 차주가 신청할 수 있다.","3년 이상~5년 미만: 최대 상승폭 1.50%p 이하 설정, 리스크프리미엄 0.15%","5년 이상~7년 미만: 최대 상승폭 2.00%p 이하 설정, 리스크프리미엄 0.20%","MCI/MCG 및 주금공 구입자금보증 가입대출도 신청 가능하다."],a:3,e:"주거용 오피스텔 담보대출, MCI/MCG 및 주금공 구입자금보증 가입대출은 금리상한 옵션 전환제도 신청이 불가하다. 연간 상승폭은 0.5%p 이하로 설정한다.",r:"BNK 행복스케치 모기지론 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"「ONE 주택담보대출」에 대한 내용으로 옳지 않은 것은?",o:["비대면은 KB시세 고시 아파트만 대상으로 한다.","본부 금리감면 신청이 불가하다.","대출기간은 10년 이상 40년 이내(수도권·규제지역은 30년 이내)이다.","비대면 전결권은 대출금액과 관계없이 영업점(센터)장 전결이다."],a:3,e:"비대면은 대출금액 10억원 이하 책임자 전결, 10억원 초과 영업점(센터)장 전결이다. 대면은 영업점(소)장 전결.",r:"ONE주택담보대출 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"「BNK 행복스케치 전세자금대출」에 대한 내용으로 옳지 않은 것은?",o:["대출한도는 임차보증금의 80% 이내(공공임대 90%, 특례보증 100%)이다.","최대 4.44억원이며 1주택자는 최대 2.22억원이다.","보증서담보등록은 원칙 90%(수도권 및 규제지역 소재 신규 취급은 80%)이다.","대출기간은 1년 이상 5년 이내이다."],a:3,e:"대출기간은 1년 이상 3년 이내이며 원칙적으로 임대차계약 만료일까지이다. 기한연장은 1회 3년 이내, 최초 대출일 포함 최장 10년.",r:"BNK 행복스케치 전세자금대출 업무매뉴얼"},
{c:"여신",s:"신규",t:"mc",q:"「BNK 전세안심대출」에 대한 내용으로 옳지 않은 것은?",o:["전세보증금반환보증과 전세자금대출특약보증은 반드시 동시 가입하여야 한다.","대상 주택은 연립/다세대, 주거용 오피스텔, 아파트이며 단독주택은 불가하다.","전세계약기간은 1년 이상 2년 이내이며 계약일과 잔금일 사이가 14일을 초과하여야 한다.","대출실행일 다음날까지 전입 및 입주하면 된다."],a:3,e:"대출실행일 당일 전입 및 입주가 필수이며, 당일 전입 후 주민등록등본 및 전입세대확인서를 징구한다.",r:"BNK 전세안심대출 업무매뉴얼"},
// ===== 신규: 여신 빈칸 12문항 =====
{c:"여신",s:"신규",t:"fill",q:"근린주택은 공부상 주택 및 근린생활시설로서 건물 전체 면적 중 주택부분이 (    ) 이상인 건물을 말한다.",a:["1/2","2분의1","2분의 1","50%"],e:"근린주택: 공부상 주택 및 근린생활시설로서 전체 면적 중 주택부분이 1/2 이상인 건물. 주택·상가임대차보증금 모두 공제하며 MCI·주금공 구입자금보증 가입 불가.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"fill",q:"주택담보대출 기본한도 산출 시 공제하는 소액보증금은 광역시의 경우 (    )만원이다.",a:["2,800","2800"],e:"소액보증금: 광역시 2,800만원(기장군은 기타지역으로 2,500만원, 서울 5,500만원). 기본한도 = 담보물평가금액 × MIN(회수인정비율, LTV) - 선순위설정액 - 소액보증금 + 보증서/보험금액.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"fill",q:"경매(공매)로 주택 취득 시 대출한도는 경락(매각)금액의 (    )%를 초과할 수 없다.",a:["80","80%"],e:"경락(매각)금액의 80% 초과 불가. 단, 전세사기피해자는 낙찰금액 100% 이내 취급 가능(최대금액 4억원).",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"fill",q:"'25.6.27 이후 규제지역 내 1주택 세대의 기존주택 처분조건 특약상 처분기한은 취급일로부터 (    ) 이내이다.",a:["6개월","6월","6개월이내"],e:"'25.6.27 이전 취급분은 2년 이내, 이후 취급분은 6개월 내 처분. 미처분 시 기한이익 상실 및 향후 3년간 주택관련 대출 제한.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"fill",q:"기존주택 처분조건 특약 미이행 시 대출 기한이익 상실 및 향후 (    )년간 주택관련 대출이 제한된다.",a:["3","3년"],e:"처분조건 미이행 시 기한이익 상실 + 향후 3년간 주택관련 대출 제한. 중도상환 제한 특약 이행 증명 불가 시에도 동일하다.",r:"주택담보대출 운용기준"},
{c:"여신",s:"신규",t:"fill",q:"고DSR 대출이란 DSR 비율 (    )%를 초과하는 대출을 말한다.",a:["70","70%"],e:"고DSR 대출: DSR 70% 초과 대출. (참고: 고부담대출은 LTV 또는 DTI 60% 초과)",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"fill",q:"전 은행권 누적 가계신용대출이 (    )을 초과하는 차주가 대출일로부터 1년 이내 규제지역 내 주택 구입 시 기한이익이 상실된다.",a:["1억원","1억","100백만원"],e:"고액 신용대출 사후 용도관리: 전 은행권 누적 가계신용대출 1억원 초과 시, 대출일로부터 1년 이내(또는 전액 상환 시까지) 규제지역 내 주택 구입 시 기한이익 상실. 추가약정서·무주택조회 동의서 징구, 6개월 단위 1년까지 사후관리.",r:"DSR운용지침"},
{c:"여신",s:"신규",t:"fill",q:"건당 (    )을 초과하는 가계대출은 대출금 사용내역표를 징구하고 3개월 이내 사후관리를 실시한다.",a:["10억원","10억"],e:"건당 10억원 초과 가계대출: 대출금 사용내역표 징구, 3개월 이내 사후관리 실시.",r:"개인CSS여신 대출심사 및 대출실행 업무매뉴얼"},
{c:"여신",s:"신규",t:"fill",q:"대출계약 철회는 계약서류를 발급받은 날(대출실행일)로부터 (    )일 이내 신청 가능하다.",a:["14","14일"],e:"계약서류를 발급받은 날(대출실행일)로부터 14일 이내 신청 가능. 일반금융소비자 대상, 대출금액 제한 없음, 중도상환수수료 면제.",r:"대출계약 철회제도 업무매뉴얼"},
{c:"여신",s:"신규",t:"fill",q:"「BNK 프리미엄 전세자금대출」취급 시 임차보증금 반환채권에 대하여 대출금액의 (    )% 이상 질권을 설정한다.",a:["120","120%"],e:"임차보증금 반환채권 질권설정: 대출금액의 120% 이상. 질권설정통지비용 3만원은 고객부담(가수금 예치).",r:"BNK 프리미엄 전세자금대출 업무매뉴얼"},
{c:"여신",s:"신규",t:"fill",q:"「BNK 전세안심대출」의 대출 및 보증 만료일자는 반드시 임대차계약 종료일자 + (    )로 한다.",a:["1개월","1달","1월"],e:"대출 및 보증 만료일자는 반드시 '임대차계약 종료일자 + 1개월'이다. 대출기간은 12~25개월 이내.",r:"BNK 전세안심대출 업무매뉴얼"},
{c:"여신",s:"신규",t:"fill",q:"여신 기한연장 시 1회 기한연장 기간은 주택담보대출의 경우 (    ) 이내이다. (BS 7등급 이하는 1년 이내)",a:["3년","3"],e:"1회 기한연장 기간: 주담대 3년 이내(BS 7등급 이하는 1년 이내), 기타대출 1년 이내. 개별대출로 BS 2등급/신용등급 AA 이상은 3년 이내 가능.",r:"여신 기한연기 관련 업무매뉴얼"},
// ===== 신규: 외환 OX 8문항 =====
{c:"외환",s:"신규",t:"ox",q:"외국환 관련 수수료는 원화로 받는 것이 원칙이다.",a:"O",e:"수수료는 원화로 받는 것이 원칙이며, 외화대출·내국수입유산스 등 별도 규정이 있는 경우 외화로 받을 수 있다. 적용환율은 받는 시점의 기준환율이다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"ox",q:"매매를 수반하지 않고 동종 외화로 대체되는 경우 0.1%의 대체료를 징수한다.",a:"O",e:"대체료는 0.1% 징수. 면제 사유: 외화예금 입출금(당일입금 당일출금 대체 제외), 외화대출 취급시점, 매입외환 부도 후 재입금, 외화현찰수수료 징구 거래, 가계정(외화별단·외화가수금) 입금.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"ox",q:"환가료율 및 국제금리 계산 시 1년은 모든 통화에 대해 360일을 적용한다.",a:"X",e:"환가료율·국제금리는 1년 360일 적용이 원칙이나 GBP, JPY, HKD, SGD는 365일을 적용한다. 원화대출금리는 1년 365일 적용.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"ox",q:"중국 위안화(CNY)의 외화현찰수수료율은 1.75%이다.",a:"X",e:"CNY, IDR, MYR, PHP, TWD, THB는 6.00%를 적용하며, 그 외 통화(USD, EUR, JPY 등)가 1.75%이다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"ox",q:"소액 미달환은 미화 100불 미만 미달환을 대상으로 하며, 1년 경과 시 처리 당일 환율을 적용하여 잡익/잡손 처리한다.",a:"O",e:"소액 미달환: 미화 100불 미만 대상, 1년 경과 시 처리 당일 환율 적용 잡익/잡손 처리. 미화 1,000불 초과 금액은 금융시장지원부 대사계 승인 후 정리한다.",r:"대사 업무매뉴얼"},
{c:"외환",s:"신규",t:"ox",q:"여행자수표의 법정 제시기간은 6개월이다.",a:"X",e:"여행자수표는 제시기간이 무기한이다. 지급지 미국 기준: 개인수표 3개월, 은행수표 6개월, US Treasury Check 1년.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"ox",q:"외화수표의 배서는 제3자 배서도 가능하다.",a:"X",e:"배서는 영문으로 수취인 본인이 해야 정당하며 제3자 배서는 취급 불가하다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"ox",q:"외화정기예금의 만기일이 공휴일인 경우 익영업일이 만기일이 된다.",a:"O",e:"외화정기예금 만기일이 공휴일인 경우 익영업일이 만기일이다. 약정기간은 3년 이하(3년 초과 시 자금부장 승인 필요).",r:"외화예금 운용기준"},
// ===== 신규: 외환 객관식 24문항 =====
{c:"외환",s:"신규",t:"mc",q:"전신환매도율 적용 대상이 아닌 것은?",o:["추심전 매입 외화수표의 부도대금 및 이자","대외지급수수료","외화대출·외화대지급금 원금 및 이자","외화현찰 매입대금"],a:3,e:"전신환매도율 적용 대상: 추심전 매입 외화수표·수출환어음·외화내국신용장어음 부도대금 및 이자, 대외지급수수료, 외화대출·외화대지급금 원리금, 취급점장이 인정하는 거래. 일반 수수료는 받는 시점의 기준환율 적용.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"mc",q:"EL등급별 차등요율 적용 대상이 아닌 것은?",o:["신용장 개설수수료","내국신용장 개설수수료","기한부인수수수료","신용장 매입환가료"],a:3,e:"EL등급별 차등요율 적용 대상[신내기내무]: ①신용장 개설수수료 ②내국신용장 개설수수료 ③기한부인수수수료 ④내국수입유산스 이자 ⑤무신용장 매입환가료. 수출이자와 신용장 매입환가료는 차등 대상이 아니다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"mc",q:"외화현찰수수료 6.00% 적용 통화가 아닌 것은?",o:["중국 위안화(CNY)","태국 바트(THB)","일본 엔화(JPY)","말레이시아 링기트(MYR)"],a:2,e:"6.00% 적용 통화: CNY, IDR(인도네시아 루피아), MYR, PHP(필리핀 페소), TWD(대만 달러), THB. JPY는 그 외 통화로 1.75%를 적용한다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"mc",q:"외화현찰수수료 면제 사유로 옳지 않은 것은?",o:["외화 현찰로 본인 외화예금에 입금하는 경우","외화 현찰로 입금 후 입금 범위 내 동일 외화현찰을 인출하는 경우","현찰입금 후 10일 경과하여 외화대체 인출하는 경우","현찰입금 후 5일 경과하여 외화대체 인출하는 경우"],a:3,e:"외화대체 인출은 현찰입금 후 10일이 경과해야 수수료가 면제된다. 정부/지자체의 미화현찰 당좌 인출도 면제 대상이다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"mc",q:"전신료 요율로 옳지 않은 것은?",o:["일람불 신용장 개설: 20,000원","기한부 신용장 개설: 25,000원","보증/특수신용장: 35,000원","송금 전문: 15,000원"],a:3,e:"송금 전문 전신료는 8,000원이다(조건변경도 8,000원). 일람불 개설 20,000원, 기한부 개설 25,000원, 보증/특수신용장 35,000원은 맞다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"mc",q:"외국환 업무 전결권으로 옳은 것은?",o:["당발송금 국외 미화 50천불 이하: 책임자 전결","타발송금 미화 50천불 초과: 영업점장 전결","환전/재환전: 영업점장 전결","외화예금취급: 영업점장 전결"],a:0,e:"당발송금은 국외 미화 50천불/국내 미화 100천불 기준으로 이하 책임자, 초과 영업점장 전결. 타발송금은 미화 100천불 기준. 환전/재환전과 외화예금취급은 책임자 전결이다.",r:"외국환 업무 전결권"},
{c:"외환",s:"신규",t:"mc",q:"개별환율 우대율 한도로 옳지 않은 것은?",o:["미달러화: 매매공차의 70% 이내","PHP, TWD, MYR, IDR, VND 현찰: 매매공차의 50% 이내","ONE환전 USD/JPY/EUR: 매매공차의 90% 이내","모든 통화 일괄 매매공차의 100% 이내"],a:3,e:"개별환율 우대율 한도는 매매공차의 70% 이내(PHP·TWD·MYR·IDR·VND 현찰은 50%, ONE환전 USD/JPY/EUR은 90%)이며 100% 우대는 없다.",r:"환율 및 포지션집중 업무지침"},
{c:"외환",s:"신규",t:"mc",q:"외국환 포지션 구분으로 옳은 것은?",o:["당발송금: 매입포지션","외화수표매입: 매도포지션","원화대가 수입어음결제: 매도포지션","외화예금 지급: 매도포지션"],a:2,e:"매입포지션(원화를 대가로 외화 매입): 원화대가 선적서류 매입, 외화수표매입, 외화예금 지급 등. 매도포지션(원화를 대가로 외화 매도): 원화대가 수입어음결제, 외화수표 매도, 당발송금 등.",r:"환율 및 포지션집중 업무지침"},
{c:"외환",s:"신규",t:"mc",q:"장기미달환 보고 기준으로 옳은 것은?",o:["당/타발송금: 10일 이상 & 1천미불 이상","당/타발송금: 30일 이상 & 5천미불 이상","수출/수입/기타: 10일 이상 & 1천미불 이상","수출/수입/기타: 60일 이상 & 1만미불 이상"],a:0,e:"장기미달환 보고: 당/타발송금 10일 이상 & 1천미불 이상, 수출/수입/기타 30일 이상 & 5천미불 이상. 매월 10일·25일 기준 부실점장 결재 후 금융시장지원부에 장기미달환 정리전말보고서 제출.",r:"대사 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"거주자·비거주자 판정으로 옳지 않은 것은?",o:["외국인은 국내에서 3개월 이상 체재 시 거주자이다.","국민이 2년 이상 해외에 체재하면 비거주자이다.","대한민국 내에 주된 사무소를 둔 법인은 거주자이다.","주한 외국공관 및 외교관·영사관원은 비거주자이다."],a:0,e:"외국인은 6개월 이상 국내 체재 시 거주자이다(3개월이 아님). 국민은 3개월 이상 국내 경제활동 시 거주자, 2년 이상 해외체재 시 비거주자.",r:"거주자와 비거주자의 구분"},
{c:"외환",s:"신규",t:"mc",q:"비거주자에 대한 외국환 매도 기준으로 옳지 않은 것은?",o:["최근 입국일 이후 매각실적 범위 내 매도 가능하다.","외국에서 발행된 신용/직불카드로 인출한 범위 내 매도 가능하다.","증빙서류 없이 1만불 초과 매각 시 대외지급수단매매 신고필증을 제출받아 매도한다.","비거주자에게는 어떠한 경우에도 매도가 불가하다."],a:3,e:"비거주자도 ①최근 입국일 이후 매각실적 범위 내 ②외국 발행 신용/직불카드 인출 범위 내 ③대외지급수단매매 신고필증 제출 시 매도가 가능하다. 1만불 초과 매도 시 외국환신고(확인)필증을 발급한다.",r:"외국통화 매도 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"해외여행경비 매각에 대한 내용으로 옳지 않은 것은?",o:["일반해외여행자는 실수요증빙서류가 없는 경우 금액 제한이 없다(외국인거주자는 1만불 이내).","해외체재자(해외유학생 포함)는 금액 제한이 없다.","법인명의의 일반 해외여행경비는 금액 제한이 없다.","북한지역 관광객은 5천불 이내 경비를 휴대 수출할 수 있다."],a:3,e:"북한지역 관광객 및 남북한 이산가족 방문 여행자는 2천불 이내 경비 휴대 수출이 가능하다. 연간 해외경비 지급금액 미화 10만불 초과 시 국세청·금감원 통보.",r:"해외여행경비 등의 지급방법 및 유의사항"},
{c:"외환",s:"신규",t:"mc",q:"외국환신고(확인)필증 발급대상이 아닌 것은?",o:["해외유학경비 미화 1만불 초과 휴대 반출","재외동포 국내재산반출 미화 1만불 초과","실수요증빙서류가 없는 일반해외여행경비","외국인의 급여소득(증빙서류 제출)"],a:2,e:"무증빙 일반해외여행경비는 필증 발급 대상이 아니다. 실수요증빙이 있는 여행경비는 금액 무관 발급 대상이며, 외국인 급여소득은 증빙서류 제출 시 금액과 관계없이 발급한다.",r:"외국환신고(확인)필증 발급대상"},
{c:"외환",s:"신규",t:"mc",q:"외화수표 추심전 매입 대상으로 옳지 않은 것은?",o:["본인이 직접 서명한 여행자수표","환거래은행이나 공공기관이 발행한 대외지급수단","환전영업자가 제시하는 여행자수표","제3자가 배서한 개인수표"],a:3,e:"제3자 배서 수표는 취급 불가하다. 이외에는 부도 시 대금회수가 확실하다고 인정되어 적절한 채권보전책을 취한 경우 추심전 매입이 가능하다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"외화수표 문구별 처리방법으로 옳은 것은?",o:["'Negotiable only in the U.S. and possessions' 수표는 국내에서 매입 가능하다.","지시금지식(Not negotiable 등)으로 발행된 수표는 수표면상 수취인으로부터 직접 추심전 매입하거나 추심 후 지급한다.","USD 이외 통화의 수표도 제한 없이 취급 가능하다.","배서는 자국문자로 하면 된다."],a:1,e:"'Negotiable only in the U.S. and possessions'는 미국으로 매입이 제한되어 취급 불가, USD 이외 통화는 취급 불가, 배서는 영문으로 수취인 본인이 해야 한다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"외화수표 추심전 지급 전결한도로 옳지 않은 것은?",o:["은행수표 5천불 이하: 책임자 전결","여행자수표 5천불 초과: 지점장 전결","기타외화수표(신용) 5천불 이하: 책임자 전결","기타외화수표(담보범위 내) 5천불 이하: 지점장 전결"],a:3,e:"기타외화수표 담보범위 내는 1만불 이하 책임자, 1만불 초과 지점장 전결이다. 은행수표·여행자수표·Money Order는 5천불 기준이며 국고수표는 은행수표에 준한다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"제3자 지급등의 방법 신고기준으로 옳은 것은?",o:["미화 5천불 이하: 신고 예외","미화 5천불 초과~1만불 이하: 한국은행 신고","미화 1만불 초과: 외국환거래은행 신고","금액과 관계없이 신고 예외"],a:0,e:"제3자 지급등의 방법: 5천불 이하 신고 예외 / 5천불 초과~1만불 이하 외국환거래은행 신고 / 1만불 초과 한국은행 신고.",r:"당발송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"국세청·관세청 통보대상으로 옳지 않은 것은?",o:["건당 미화 5천불 초과 거주자의 증여성 지급금액이 지급인별 연간 1만불 초과 시 국세청 통보","해외유학생·체재자의 해외여행경비 지급금액이 연간 미화 10만불 초과 시 국세청 통보","건당 미화 1만불 초과 금액을 외국환은행을 통하여 지급·영수하는 경우 통보","건당 5천불 초과 해외이주비 지급 시 관세청 통보"],a:3,e:"관세청 통보 대상 해외이주비는 건당 1만불 초과이다. 수출입대금 지급·영수, 용역대가, 건당 5천불 초과 증여성 지급도 관세청 통보 대상이다.",r:"당발송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"외화자동송금 서비스에 대한 설명으로 옳지 않은 것은?",o:["자동송금: 일정한 주기(1,2,3개월)마다 일정 금액을 지정일자에 자동·반복 송금한다.","예약송금: 특정일 1회 송금한다.","BNK바로모아송금: 송금전용계좌로 입금하면 수수료를 차감하여 지정된 해외수취인 앞으로 자동송금한다.","약식송금: 과거 송금실적이 있는 이용자가 동일은행·동일계좌로 송금 시 이전 참조번호 등을 기재하여 송금한다."],a:2,e:"송금전용계좌 입금 시 수수료 차감 후 자동송금하는 것은 BNK ONESHOT송금이다. BNK바로모아송금은 연동계좌 입금액이 지정한 송금금액에 도달하면 자동 송금하는 방식이다.",r:"외화자동송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"이종통화송금에 대한 내용으로 옳지 않은 것은?",o:["거래대상은 실명의 개인만 가능하다.","취급통화는 PHP, VND, TWD 등 16개 통화이다.","송금한도는 도이치뱅크 1백만불, 뱅크오브뉴욕멜론 2백만불 이내이다.","통화별 자금결제처리시점이 처리일부터 2영업일까지 각각 상이하다."],a:0,e:"이종통화송금의 거래대상은 실명의 개인 및 법인(비거주자 포함)이다. 개인만이 아니다.",r:"이종통화송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"타발송금의 무연동 지급 가능 사유가 아닌 것은?",o:["외국인투자자의 유가증권청약증거금 입금","상속","외환사업부장의 '고객별 예외승인'을 득한 경우","수취인의 단순 요청"],a:3,e:"타발송금은 수취인계좌 연동입금이 원칙이며, 무연동 지급은 유가증권청약증거금 입금·상속·외환사업부장의 고객별 예외승인 시 타발송금 변경요청서를 징구하고 가능하다.",r:"타발송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"거주자계정과 대외계정 비교로 옳지 않은 것은?",o:["거주자계정은 국민인거주자, 외국인개인사업자가 개설한다.","대외계정은 비거주자, 외국인거주자가 개설한다.","거주자계정은 외화 2만불 초과 예치 시 외국환신고(확인)필증을 확인한다.","대외계정의 원화 예치는 제한이 없다."],a:3,e:"대외계정의 원화 예치는 대외지급 인정자금만 가능하다. 대외계정은 원화인출 2만불 초과 시 사유 확인(해외재산반입자금 처리), 외화휴대 1만불 초과 시 필증 교부.",r:"예금 종류별, 계정별 예치, 처분 시 업무처리 방법"},
{c:"외환",s:"신규",t:"mc",q:"업앤업 외화정기예금에 대한 내용으로 옳지 않은 것은?",o:["가입통화는 USD, EUR, JPY이다.","미화 1천불 이상 가입, 계약기간 12개월이다.","월복리 회전식 정기예금이다.","1년 만기 후 자동 재예치된다."],a:3,e:"업앤업 외화정기예금은 1년 만기 상품으로 자동 재예치가 불가하며 해지 후 신규해야 한다. 계단식 금리 적용으로 장기보유 시 정기예금 수준 금리를 제공하고, 각 구간별 산출 이자율의 8%까지 가산 우대 가능하다.",r:"외화예금 업무매뉴얼"},
{c:"외환",s:"신규",t:"mc",q:"ONE환전에 대한 내용으로 옳지 않은 것은?",o:["로그인 환전 이용한도는 USD 100~3,000(미수령 잔액 1만불 이하)이다.","비로그인 환전은 1일 원화 1백만원 이하이다.","인수예정일은 30일 이내 지정 가능하며 예정일 포함 7영업일까지 유효하다.","비로그인 환전도 외화ATM, 현찰배달 수령이 가능하다."],a:3,e:"비로그인 환전은 영업점 수령만 가능하다. 영업점·외화ATM·금고보관·현찰배달($100~150만원)은 로그인 환전의 수령 방법이다.",r:"인터넷외환취급 업무매뉴얼"},
// ===== 신규: 외환 빈칸 8문항 =====
{c:"외환",s:"신규",t:"fill",q:"일람불 환가료율 적용기간은 신용장방식 (    )일, 무신용장방식 및 기타거래 10일이다.",a:["8","8일"],e:"일람불 환가료율 적용기간: 신용장방식 8일 / 무신용장방식 및 기타거래 10일. 일수 계산은 일단위, 한편넣기.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"fill",q:"매매를 수반하지 않고 동종 외화로 대체되는 경우 (    )%의 대체료를 징수한다.",a:["0.1","0.1%"],e:"대체료는 0.1% 징수하며 외화예금 입출금, 외화대출 취급시점, 외화현찰수수료 징구 거래, 가계정 입금 등은 면제된다.",r:"외국환수수료지침"},
{c:"외환",s:"신규",t:"fill",q:"미달환 정리 시 미화 (    ) 초과 금액은 금융시장지원부 대사계 승인 후 정리한다.",a:["1,000불","1000불","1천불","천불","1,000달러","1000달러"],e:"미화 1,000불 초과 금액은 금융시장지원부 대사계 승인 후 정리. 소액 미달환(100불 미만)은 1년 경과 시 잡익/잡손 처리.",r:"대사 업무매뉴얼"},
{c:"외환",s:"신규",t:"fill",q:"동일자 미화 (    ) 초과 외국환 매입·매도 시 국세청 및 관세청에 통보한다.",a:["1만불","10,000불","10000불","만불","1만달러"],e:"동일자 미화 1만불 초과 매입/매도 시 국세청 및 관세청 통보. 휴대반출 1만불 초과 시에는 관할세관장에게 신고한다.",r:"외국환 매매 시 유의사항"},
{c:"외환",s:"신규",t:"fill",q:"외화수표 부도이자는 원금 × (받는 날의 통화별 일람불 환가료율 + (    )%) × 기간/360으로 산출한다.",a:["3","3%"],e:"부도대금 환수액 = 원금 + 부도이자. 부도이자 = 원금 × (일람불 환가료율 + 3%) × 기간/360. 원금은 외화 또는 환수당일 대고객 전신환매도율 적용 원화로 회수한다.",r:"외화수표 매입 및 추심 업무매뉴얼"},
{c:"외환",s:"신규",t:"fill",q:"타발송금 지급 시 (    ) 상당액 이하 송금은 실명확인을 생략할 수 있다.",a:["1백만원","100만원","백만원","원화 1백만원"],e:"1백만원 상당액 이하 송금과 계좌번호가 명기되어 송금된 경우 실명확인 생략 가능하다.",r:"타발송금 업무매뉴얼"},
{c:"외환",s:"신규",t:"fill",q:"해외이주자는 해외이주자로 인정받은 날로부터 (    )년 이내에 지정거래외국환은행의 장에게 신청하여 해외이주비를 지급한다.",a:["3","3년"],e:"해외이주자로 '인정받은 날'로부터 3년 이내에 해외이주비 지급을 신청해야 한다. 지급한도 제한은 없으며, 해외이주자는 해외여행경비 지급이 불가하다.",r:"해외유학생, 이주자 취급지침"},
{c:"외환",s:"신규",t:"fill",q:"당발송금 시 USD (    ) 초과 고액송금은 자금부 사전승인을 받아야 한다. (17시 이후에는 10만불)",a:["100만불","1백만불","1,000,000불","백만불"],e:"고액송금 자금부 사전승인: USD 100만불 초과(17시 이후 10만불) / JPY 30백만엔 초과(16시 이후 5만불 상당액 초과 시).",r:"당발송금 업무매뉴얼"}
];

// ---- 앱 ----
const $ = id => document.getElementById(id);
let filters = { cat: "전체", src: "전체", ord: "랜덤" };
let pool = [], idx = 0, answers = [];

function segInit(id, key) {
  $(id).querySelectorAll("button").forEach(b => b.onclick = () => {
    $(id).querySelectorAll("button").forEach(x => x.classList.remove("on"));
    b.classList.add("on"); filters[key] = b.dataset.v; updateStartBtn();
  });
}
segInit("f-cat", "cat"); segInit("f-src", "src"); segInit("f-ord", "ord");

function filtered() {
  return Q.filter(q => (filters.cat === "전체" || q.c === filters.cat) && (filters.src === "전체" || q.s === filters.src));
}
function updateStartBtn() { $("btn-start").textContent = "시험 시작 (" + filtered().length + "문항)"; }

$("btn-start").onclick = () => {
  pool = filtered().slice();
  if (filters.ord === "랜덤") for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
  startRun();
};
function startRun() {
  idx = 0; answers = new Array(pool.length).fill(null);
  $("screen-start").style.display = "none"; $("screen-end").style.display = "none";
  $("screen-quiz").style.display = "block"; render();
}

const typeName = { ox: "OX", mc: "객관식", fill: "빈칸" };
function render() {
  const q = pool[idx];
  $("q-cat").textContent = q.c; $("q-src").textContent = q.s; $("q-type").textContent = typeName[q.t];
  $("q-prog").textContent = (idx + 1) + " / " + pool.length;
  $("q-text").textContent = q.q;
  $("q-result").className = "result"; $("nextbar").style.display = "none";
  $("cmt-sec").style.display = "none";
  $("btn-prev").disabled = idx === 0;
  $("rep-box").style.display = "none"; $("rep-text").value = ""; $("rep-msg").textContent = "";
  const opts = $("q-opts"); opts.innerHTML = ""; opts.className = "opts" + (q.t === "ox" ? " ox" : "");
  $("q-fill").style.display = "none"; $("q-hint").style.display = "none";
  if (q.t === "ox") {
    ["O", "X"].forEach(v => { const b = document.createElement("button"); b.textContent = v; b.dataset.v = v; b.onclick = () => grade(v === q.a, v); opts.appendChild(b); });
  } else if (q.t === "mc") {
    q.o.forEach((t, i) => { const b = document.createElement("button"); b.textContent = "①②③④"[i] + " " + t; b.dataset.i = i; b.onclick = () => grade(i === q.a, i); opts.appendChild(b); });
  } else {
    $("q-fill").style.display = "flex"; $("fill-input").value = ""; $("fill-input").disabled = false; $("fill-submit").disabled = false;
    if (q.h) { $("q-hint").style.display = "block"; $("q-hint").textContent = q.h; }
  }
  const st = answers[idx];
  if (st) showResult(st.ok, st.given);
  else if (q.t === "fill") $("fill-input").focus();
}
const norm = s => String(s).replace(/\s+/g, "").replace(/，/g, ",").toLowerCase();
$("fill-submit").onclick = () => {
  const q = pool[idx]; const v = $("fill-input").value; if (!v.trim()) return;
  grade(q.a.some(x => norm(x) === norm(v)), v);
};
$("fill-input").addEventListener("keydown", e => { if ((e.key === "Enter" || e.keyCode === 13) && !$("fill-submit").disabled) $("fill-submit").onclick(); });

function grade(ok, given) {
  if (answers[idx]) return;
  answers[idx] = { ok, given };
  saveSession();
  showResult(ok, given);
  $("btn-next").focus();
}
function showResult(ok, given) {
  const q = pool[idx];
  $("q-opts").querySelectorAll("button").forEach(b => {
    b.disabled = true;
    if (q.t === "ox") {
      if (b.dataset.v === q.a) b.classList.add("correct");
      if (!ok && b.dataset.v === given) b.classList.add("wrong");
    }
    if (q.t === "mc") {
      if (Number(b.dataset.i) === q.a) b.classList.add("correct");
      if (!ok && Number(b.dataset.i) === given) b.classList.add("wrong");
    }
  });
  if (q.t === "fill") { $("fill-input").value = given; $("fill-input").disabled = true; $("fill-submit").disabled = true; }
  const ansText = q.t === "ox" ? q.a : q.t === "mc" ? "①②③④"[q.a] + " " + q.o[q.a] : q.a[0];
  $("q-result").className = "result " + (ok ? "ok" : "no");
  $("r-verdict").textContent = ok ? "정답입니다!" : "오답입니다";
  $("r-ans").textContent = "정답: " + ansText;
  $("r-expl").textContent = q.e;
  $("r-ref").textContent = "출처: " + q.r;
  $("nextbar").style.display = "block";
  $("btn-next").textContent = idx + 1 === pool.length ? "결과 보기" : "다음 문제";
  $("cmt-sec").style.display = "block";
  renderComments();
  refreshComments(); // 웹서버 모드: 다른 사람이 새로 단 댓글 반영
}
$("btn-next").onclick = () => { idx++; saveSession(); if (idx < pool.length) render(); else finish(); };
$("btn-prev").onclick = () => { if (idx > 0) { idx--; saveSession(); render(); } };

function finish() {
  try { sessionStorage.removeItem("quiz-session"); } catch {}
  const correct = answers.filter(a => a && a.ok).length;
  const wrongs = pool.filter((q, i) => answers[i] && !answers[i].ok);
  $("screen-quiz").style.display = "none"; $("screen-end").style.display = "block";
  $("e-pct").textContent = Math.round(correct / pool.length * 100) + "점";
  $("e-detail").textContent = pool.length + "문항 중 " + correct + "개 정답 · " + wrongs.length + "개 오답";
  window._wrongs = wrongs;
  const w = $("e-wrong"); w.innerHTML = "";
  if (wrongs.length) {
    const h = document.createElement("div"); h.style.fontWeight = "bold"; h.style.marginBottom = "6px"; h.textContent = "틀린 문제"; w.appendChild(h);
    wrongs.forEach(q => {
      const d = document.createElement("div"); d.className = "wrongitem";
      const t = document.createElement("div"); t.className = "wq"; t.textContent = "[" + q.c + "·" + q.s + "] " + q.q;
      const a = document.createElement("div"); a.className = "wa";
      a.textContent = "정답: " + (q.t === "ox" ? q.a : q.t === "mc" ? "①②③④"[q.a] + " " + q.o[q.a] : q.a[0]);
      d.appendChild(t); d.appendChild(a); w.appendChild(d);
    });
  }
  $("btn-retry").style.display = wrongs.length ? "block" : "none";
  updateDlBtns();
}
$("btn-retry").onclick = () => { pool = window._wrongs.slice(); startRun(); };
$("btn-home").onclick = () => { $("screen-end").style.display = "none"; $("screen-start").style.display = "block"; updateStartBtn(); updateDlBtns(); };
updateStartBtn();

// ---- 문제 제보 ----
const REP_KEY = "quiz-reports";
let memReports = null; // localStorage 차단 환경 폴백 (세션 내에서만 유지)
const getReports = () => { if (memReports) return memReports; try { return JSON.parse(localStorage.getItem(REP_KEY)) || []; } catch { memReports = []; return memReports; } };
const saveReports = reps => { try { localStorage.setItem(REP_KEY, JSON.stringify(reps)); } catch { memReports = reps; } };
$("rep-toggle").onclick = () => {
  const box = $("rep-box");
  box.style.display = box.style.display === "none" ? "block" : "none";
  if (box.style.display === "block") $("rep-text").focus();
};
$("rep-send").onclick = () => {
  const note = $("rep-text").value.trim(); if (!note) return;
  const q = pool[idx];
  const reps = getReports();
  reps.push({ time: new Date().toLocaleString("ko-KR"), cat: q.c, src: q.s, type: typeName[q.t], q: q.q, note });
  saveReports(reps);
  $("rep-text").value = "";
  $("rep-msg").textContent = "저장됨 ✓ (총 " + reps.length + "건)";
  updateDlBtns();
};
function updateDlBtns() {
  const n = getReports().length;
  ["btn-dl-start", "btn-dl-end"].forEach(id => {
    const b = $(id);
    b.style.display = n ? "block" : "none";
    b.textContent = "제보 내역 .md 다운로드 (" + n + "건)";
  });
}
async function downloadReports() {
  const reps = getReports();
  let md = "# 문제은행 제보 내역\n\n총 " + reps.length + "건\n";
  reps.forEach((r, i) => {
    md += "\n---\n\n## " + (i + 1) + ". [" + r.cat + "·" + r.src + "·" + r.type + "] " + r.time + "\n\n";
    md += "**문제:** " + r.q.replace(/\n/g, " / ") + "\n\n";
    md += "**제보 내용:** " + r.note + "\n";
  });
  // 아티팩트 뷰어에서는 downloads capability로만 저장 가능
  let dl = null;
  try { if (window.claude && window.claude.use) dl = await window.claude.use("downloads"); } catch {}
  if (dl) {
    try { await dl.save({ filename: "문제제보.md", data: md }); } catch (err) { if (err && err.code !== "declined") alert("저장에 실패했습니다. 잠시 후 다시 시도해주세요."); }
    return;
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([md], { type: "text/markdown;charset=utf-8" }));
  a.download = "문제제보.md";
  a.click(); URL.revokeObjectURL(a.href);
}
$("btn-dl-start").onclick = downloadReports;
$("btn-dl-end").onclick = downloadReports;
updateDlBtns();

// ---- 댓글 (아티팩트 공유 저장: comments.json) ----
let artNS = null, comments = {}, cmtReady = false, apiMode = false, cmtRefreshing = false;
const qkey = q => { let h = 5381; const s = q.c + "|" + q.q; for (let i = 0; i < s.length; i++) h = (h * 33 + s.charCodeAt(i)) >>> 0; return "q" + h.toString(36); };
async function initComments() {
  try { if (window.claude && window.claude.use) artNS = await window.claude.use("artifact"); } catch {}
  if (artNS) {
    // 아티팩트 모드: 아티팩트 내 comments.json 사용
    try { const r = await fetch("comments.json", { cache: "no-store" }); if (r.ok) comments = await r.json(); } catch {}
  } else {
    // 웹서버(Vercel) 모드: /api/comments 사용
    try { const r = await fetch("/api/comments", { cache: "no-store" }); if (r.ok) { comments = await r.json(); apiMode = true; } } catch {}
  }
  cmtReady = true;
  if ($("cmt-sec").style.display === "block") renderComments();
}
async function refreshComments() {
  if (!apiMode || cmtRefreshing) return;
  cmtRefreshing = true;
  try { const r = await fetch("/api/comments", { cache: "no-store" }); if (r.ok) { comments = await r.json(); if ($("cmt-sec").style.display === "block") renderComments(); } } catch {}
  cmtRefreshing = false;
}
function renderComments() {
  const q = pool[idx]; if (!q) return;
  const arr = comments[qkey(q)] || [];
  $("cmt-count").textContent = arr.length ? arr.length + "개" : "";
  const list = $("cmt-list"); list.innerHTML = "";
  if (!arr.length) { const d = document.createElement("div"); d.className = "cmt-empty"; d.textContent = "아직 댓글이 없습니다. 첫 해석을 남겨보세요."; list.appendChild(d); }
  arr.forEach(cm => {
    const d = document.createElement("div"); d.className = "cmt";
    const h = document.createElement("div"); h.className = "cmt-head"; h.textContent = cm.name + " · " + cm.time;
    const b = document.createElement("div"); b.className = "cmt-body"; b.textContent = cm.text;
    d.appendChild(h); d.appendChild(b); list.appendChild(d);
  });
  $("cmt-form").style.display = (artNS || apiMode) ? "flex" : "none";
  if (!artNS && !apiMode) $("cmt-note").textContent = cmtReady ? "댓글 작성은 웹사이트(bnk-somae.vercel.app) 또는 공유 링크(아티팩트)에서 가능합니다." : "댓글 불러오는 중...";
  else if (!$("cmt-note").dataset.keep) $("cmt-note").textContent = "";
  // 충돌 새로고침으로 보존된 작성 중 댓글 복원
  try {
    const draft = JSON.parse(sessionStorage.getItem("quiz-draft"));
    if (draft && draft.k === qkey(q)) {
      $("cmt-name").value = draft.name; $("cmt-text").value = draft.text;
      $("cmt-note").textContent = "다른 댓글이 먼저 등록되어 화면이 갱신되었습니다. 작성하던 댓글을 다시 등록해주세요.";
      sessionStorage.removeItem("quiz-draft");
    }
  } catch {}
}
try { $("cmt-name").value = localStorage.getItem("quiz-nick") || ""; } catch {}
$("cmt-send").onclick = async () => {
  if (!artNS && !apiMode) return;
  const name = $("cmt-name").value.trim() || "익명";
  const text = $("cmt-text").value.trim(); if (!text) return;
  try { localStorage.setItem("quiz-nick", name); } catch {}
  const q = pool[idx], k = qkey(q);
  if (apiMode) {
    // 웹서버 모드: API로 저장 (충돌·새로고침 걱정 없음)
    $("cmt-send").disabled = true; $("cmt-note").textContent = "저장 중...";
    try {
      const r = await fetch("/api/comments", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ k, name, text }) });
      if (!r.ok) throw new Error("api " + r.status);
      comments[k] = (await r.json()).list;
      $("cmt-text").value = ""; $("cmt-note").textContent = "";
      renderComments();
    } catch {
      $("cmt-note").textContent = "저장에 실패했습니다. 잠시 후 다시 시도해주세요.";
    }
    $("cmt-send").disabled = false;
    return;
  }
  (comments[k] = comments[k] || []).push({ name, text, time: new Date().toLocaleString("ko-KR") });
  $("cmt-send").disabled = true; $("cmt-note").textContent = "저장 중...";
  try {
    await artNS.publish({ "comments.json": JSON.stringify(comments) });
    $("cmt-text").value = ""; $("cmt-note").textContent = "";
    renderComments();
  } catch (err) {
    comments[k].pop();
    const code = err && err.code;
    if (code === "conflict") {
      // 다른 사람의 댓글이 먼저 등록됨 → 화면이 자동 새로고침되므로 작성 내용과 진도를 보존
      saveSession();
      try { sessionStorage.setItem("quiz-draft", JSON.stringify({ k, name, text })); } catch {}
      $("cmt-note").textContent = "다른 댓글이 먼저 등록되어 새로고침합니다...";
    } else if (code === "not_writer" || code === "not_granted" || code === "capability_disabled") {
      artNS = null; renderComments();
      $("cmt-note").textContent = "읽기 전용으로 열려 있어 댓글을 저장할 수 없습니다.";
    } else if (code === "rate_limited") {
      $("cmt-note").textContent = "저장이 너무 잦습니다. 잠시 후 다시 시도해주세요.";
    } else {
      $("cmt-note").textContent = "저장에 실패했습니다. 잠시 후 다시 시도해주세요.";
    }
  }
  $("cmt-send").disabled = false;
};

// ---- 세션 복원 (댓글 등록 시 다른 뷰가 새로고침되므로 진도 보존) ----
function saveSession() {
  try { sessionStorage.setItem("quiz-session", JSON.stringify({ poolIdx: pool.map(q => Q.indexOf(q)), answers, idx })); } catch {}
}
(function restoreSession() {
  let s = null;
  try { s = JSON.parse(sessionStorage.getItem("quiz-session")); } catch {}
  if (!s || !s.poolIdx || !s.poolIdx.length) return;
  pool = s.poolIdx.map(i => Q[i]).filter(Boolean);
  answers = s.answers || []; idx = Math.min(s.idx || 0, pool.length - 1);
  $("screen-start").style.display = "none"; $("screen-quiz").style.display = "block";
  render();
})();
initComments();
</script>
</body>
</html>
